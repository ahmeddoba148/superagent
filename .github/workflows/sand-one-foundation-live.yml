name: SAND ONE Capability Live Gate
on:
  push:
    branches: [sand-one-1.0]
    paths:
      - 'SAND_ONE_1.0.js'
      - 'sand_one/runtime/**'
      - 'sand_one/source/**'
      - 'sand_v2/live_gate.mjs'
      - 'tools/sand-one-ci/**'
      - '.github/workflows/sand-one-foundation-live.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SAND_ONE_1.0.js'
      - 'sand_one/runtime/**'
      - 'sand_one/source/**'
      - 'sand_v2/live_gate.mjs'
      - 'tools/sand-one-ci/**'
      - '.github/workflows/sand-one-foundation-live.yml'
permissions:
  contents: read
concurrency:
  group: sand-one-capability-live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      OKEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      CHAT: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      GSEARCH_KEY: ${{ secrets.STAGING_GOOGLE_SEARCH_API_KEY }}
      GSEARCH_CX: ${{ secrets.STAGING_GOOGLE_SEARCH_CX }}
      GMAPS_KEY: ${{ secrets.STAGING_GOOGLE_MAPS_API_KEY }}
      URL: https://sand-one-dev4-staging.ahmeddoba91.workers.dev
      DB: sand-one-dev4-staging-v1
      CFG: wrangler.sand-one-dev4.jsonc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Assemble canonical SAND ONE dev4 runtime
        run: |
          set -euo pipefail
          test -d sand_one/runtime
          count=$(find sand_one/runtime -maxdepth 1 -type f -name 'part*.js.txt' | wc -l | tr -d ' ')
          [ "$count" = "21" ]
          test -s sand_one/source/part06_00.js.txt
          test -s sand_one/source/part06_01.js.txt
          test -s sand_one/source/part07_00.js.txt
          test -s sand_one/source/part07_01.js.txt
          cat sand_one/runtime/part*.js.txt > SAND_ONE_1.0.js
          awk 'BEGIN{p=0} /^function normalizeLocalMinute\(value\) \{/ {p=1} p {print}' sand_one/source/part06_00.js.txt >> SAND_ONE_1.0.js
          cat sand_one/source/part06_01.js.txt sand_one/source/part07_00.js.txt sand_one/source/part07_01.js.txt >> SAND_ONE_1.0.js
          test -s SAND_ONE_1.0.js
          grep -q 'const APP_VERSION = "1.0.0-dev.4"' SAND_ONE_1.0.js
          grep -q '^function normalizeLocalMinute(value)' SAND_ONE_1.0.js
          grep -q '^async function health' SAND_ONE_1.0.js
          grep -q '^async function callOneAiModel' SAND_ONE_1.0.js
          sha256sum SAND_ONE_1.0.js
          wc -l -c SAND_ONE_1.0.js
          node --check SAND_ONE_1.0.js
          ! grep -q 'text\.includes(' SAND_ONE_1.0.js
          ! grep -Eq '\beval\(' SAND_ONE_1.0.js
          ! grep -q 'Math\.random' SAND_ONE_1.0.js
          ! grep -q '@ts-ignore\|@ts-nocheck' SAND_ONE_1.0.js
          ! grep -q 'AMBIGUOUS' SAND_ONE_1.0.js

      - name: checkJs zero diagnostics
        run: |
          set -euo pipefail
          npm install --no-save typescript@5.8.3 wrangler@latest >/dev/null
          printf '%s' '{"compilerOptions":{"allowJs":true,"checkJs":true,"noEmit":true,"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM"],"skipLibCheck":true,"strict":false},"files":["SAND_ONE_1.0.js"]}' > tsconfig.json
          npx tsc -p tsconfig.json --pretty false

      - name: Probe every fixed model with bounded retries
        run: |
          set -euo pipefail
          node tools/sand-one-ci/probe-models.mjs

      - name: Provision isolated dev4 staging D1
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=x.find(v=>v.name===process.env.DB);process.stdout.write(r?.uuid||r?.id||"")')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$DB" >/tmp/d1-create.txt
            sleep 2
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=x.find(v=>v.name===process.env.DB);process.stdout.write(r?.uuid||r?.id||"")')
          fi
          test -n "$DB_ID"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Deploy isolated dev4 staging
        run: |
          set -euo pipefail
          test -n "$BOT"; test -n "$OKEY"; test -n "$CHAT"; test -n "$DB_ID"
          cat > "$CFG" <<JSON
          {"name":"sand-one-dev4-staging","main":"SAND_ONE_1.0.js","compatibility_date":"2026-08-20","compatibility_flags":["global_fetch_strictly_public"],"vars":{"PUBLIC_BOT":"false"},"d1_databases":[{"binding":"DB","database_name":"$DB","database_id":"$DB_ID"}],"services":[{"binding":"OMNIAI_SERVICE","service":"omniai-engine"}]}
          JSON
          npx wrangler deploy --config "$CFG" >/dev/null
          W=$(openssl rand -hex 32); K=$(openssl rand -hex 32)
          echo "::add-mask::$W"; echo "::add-mask::$K"
          echo "W=$W" >> "$GITHUB_ENV"; echo "K=$K" >> "$GITHUB_ENV"
          for p in "TELEGRAM_BOT_TOKEN:$BOT" "OMNIAI_API_KEY:$OKEY" "TELEGRAM_WEBHOOK_SECRET:$W" "SETUP_KEY:$K" "ALLOWED_CHAT_ID:$CHAT"; do n=${p%%:*};v=${p#*:};printf '%s' "$v"|npx wrangler secret put "$n" --config "$CFG" >/dev/null;done
          if [ -n "$GSEARCH_KEY" ]; then printf '%s' "$GSEARCH_KEY"|npx wrangler secret put GOOGLE_SEARCH_API_KEY --config "$CFG" >/dev/null; fi
          if [ -n "$GSEARCH_CX" ]; then printf '%s' "$GSEARCH_CX"|npx wrangler secret put GOOGLE_SEARCH_CX --config "$CFG" >/dev/null; fi
          if [ -n "$GMAPS_KEY" ]; then printf '%s' "$GMAPS_KEY"|npx wrangler secret put GOOGLE_MAPS_API_KEY --config "$CFG" >/dev/null; fi

      - name: Health registry and selftest proof
        run: |
          set -euo pipefail
          healthy=0
          for i in {1..50}; do
            code=$(curl -sS -o /tmp/h -w '%{http_code}' "$URL/health" || true)
            if [ "$code" = 200 ] && node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/h'));
          const f=Object.fromEntries((x.capability_families||[]).map(v=>[v.id,v.state]));
          const ok=x.ok&&x.version==='1.0.0-dev.4'&&x.architecture==='semantic-conversation-workspace+capability-layer'&&x.semantic_routing===true&&x.keyword_routing===false&&x.voice_input===true&&(x.capability_families||[]).length===12&&f.schedule==='core'&&f.shopping==='active'&&f.work==='active'&&f.memory_people==='active'&&f.web_live==='active'&&f.files_media==='input_adapter'&&f.utility==='active';
          process.exit(ok?0:1);
          NODE
            then healthy=1; break; fi
            sleep 2
          done
          [ "$healthy" = 1 ] || { cat /tmp/h >&2; exit 1; }
          cat /tmp/h
          webhook_ok=0; admin_ok=0
          for i in {1..50}; do
            wc=$(curl -sS -o /tmp/w -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-Telegram-Bot-Api-Secret-Token: $W" -d '{}' "$URL/telegram" || true)
            ac=$(curl -sS -o /tmp/a -w '%{http_code}' -H "x-sand-admin: $K" "$URL/admin/selftest" || true)
            if [ "$wc" = 200 ]; then webhook_ok=$((webhook_ok+1)); else webhook_ok=0; fi
            if [ "$ac" = 200 ] && node -e 'try{const x=JSON.parse(require("fs").readFileSync("/tmp/a"));process.exit(x.ok&&Array.isArray(x.tests)&&x.tests.length>0&&x.tests.every(t=>t.ok)&&x.tests.some(t=>t.name==="voice_adapter_contract")&&x.tests.some(t=>t.name==="capability_family_contract")?0:1)}catch{process.exit(1)}'; then admin_ok=$((admin_ok+1)); else admin_ok=0; fi
            [ "$webhook_ok" -ge 3 ] && [ "$admin_ok" -ge 3 ] && break
            sleep 2
          done
          [ "$webhook_ok" -ge 3 ] && [ "$admin_ok" -ge 3 ] || { echo 'SECRET_PROPAGATION_OR_SELFTEST_FAILED'; cat /tmp/a; exit 1; }
          cat /tmp/a

      - name: Core V2 semantic regression torture gate
        run: |
          set +e
          node sand_v2/live_gate.mjs
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '===== SAND ONE CORE REGRESSION DIAGNOSTICS ====='
            npx wrangler d1 execute "$DB" --remote --config "$CFG" --command "SELECT source_update_id,status,error,plan_json,result_json FROM sand_v2_operations ORDER BY created_at DESC LIMIT 12;" || true
            npx wrangler d1 execute "$DB" --remote --config "$CFG" --command "SELECT update_id,phase,model_id,model_role,ok,http_status,error_code,created_at FROM sand_v2_ai_calls ORDER BY id DESC LIMIT 18;" || true
            exit "$rc"
          fi

      - name: Public Web Live adapter smoke
        run: |
          set -euo pipefail
          node - <<'NODE'
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          async function get(url){let last='';for(let i=1;i<=4;i++){try{const r=await fetch(url,{signal:AbortSignal.timeout(12000)});if(r.ok)return r;last='HTTP '+r.status}catch(e){last=String(e?.message||e)}await sleep(i*1000)}throw Error('live adapter smoke failed '+url+' '+last)}
          const w=await (await get('https://api.open-meteo.com/v1/forecast?latitude=30.0444&longitude=31.2357&current=temperature_2m&timezone=auto')).json();
          if(typeof w?.current?.temperature_2m!=='number') throw Error('weather payload invalid');
          const n=await (await get('https://api.gdeltproject.org/api/v2/doc/doc?query=Egypt&mode=ArtList&maxrecords=3&format=json&sort=HybridRel')).json();
          if(!Array.isArray(n?.articles)) throw Error('news payload invalid');
          const page=await get('https://example.com/');const text=await page.text();if(!text.includes('Example Domain')) throw Error('web reader smoke invalid');
          console.log('PUBLIC_WEB_LIVE_SMOKE_OK');
          NODE

      - name: Optional Google Search and Places live proof
        run: |
          set -euo pipefail
          if [ -n "$GSEARCH_KEY" ] && [ -n "$GSEARCH_CX" ]; then
            node - <<'NODE'
          const p=new URLSearchParams({key:process.env.GSEARCH_KEY,cx:process.env.GSEARCH_CX,q:'OpenAI',num:'1',safe:'active'});
          const r=await fetch('https://www.googleapis.com/customsearch/v1?'+p,{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Google Search HTTP '+r.status);const x=await r.json();if(!Array.isArray(x.items))throw Error('Google Search payload invalid');console.log('GOOGLE_SEARCH_LIVE_OK');
          NODE
          else
            echo 'GOOGLE_SEARCH_LIVE_SKIPPED_NO_STAGING_SECRET'
          fi
          if [ -n "$GMAPS_KEY" ]; then
            node - <<'NODE'
          const r=await fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',headers:{'content-type':'application/json','X-Goog-Api-Key':process.env.GMAPS_KEY,'X-Goog-FieldMask':'places.id,places.displayName'},body:JSON.stringify({textQuery:'Cairo Tower',maxResultCount:1,languageCode:'en'}),signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('Google Places HTTP '+r.status);const x=await r.json();if(!Array.isArray(x.places))throw Error('Google Places payload invalid');console.log('GOOGLE_PLACES_LIVE_OK');
          NODE
          else
            echo 'GOOGLE_PLACES_LIVE_SKIPPED_NO_STAGING_SECRET'
          fi

      - name: Upload exact certified dev4 runtime
        uses: actions/upload-artifact@v4
        with:
          name: SAND_ONE_1.0-dev4-certified-source
          path: SAND_ONE_1.0.js
          if-no-files-found: error
          retention-days: 30
