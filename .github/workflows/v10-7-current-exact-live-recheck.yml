name: V10.7 Current Exact Live Recheck

on:
  push:
    branches: [superagent-v10-7-universal-agent]
    paths:
      - '.github/workflows/v10-7-current-exact-live-recheck.yml'
      - 'tests/v10-7-current-live-recheck.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-7-current-exact-live-recheck
  cancel-in-progress: true

jobs:
  live-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      STAGING_OMNIAI_API_KEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      STAGING_URL: https://superagent-v107-staging.ahmeddoba91.workers.dev
      STAGING_DB: superagent-v106-staging
      STAGING_CONFIG: wrangler.v107.recheck.jsonc
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact certified V10.7 file
        run: |
          set -euo pipefail
          node --check SuperAgent_V10_7_Universal_Agent.js
          ACTUAL="$(sha256sum SuperAgent_V10_7_Universal_Agent.js | cut -d' ' -f1)"
          echo "candidate_sha256=$ACTUAL"
          test "$ACTUAL" = "27cb711ef88b58d14ae93ed546c38d46296ca41fa5487070b38ba34dddd38d18"
          grep -q 'const V10_VERSION="10.7"' SuperAgent_V10_7_Universal_Agent.js
          grep -q 'v107_semantic_first:true' SuperAgent_V10_7_Universal_Agent.js
          grep -q 'v107_transactional_shopping:true' SuperAgent_V10_7_Universal_Agent.js
      - name: Validate secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"; test -n "$STAGING_TELEGRAM_BOT_TOKEN"; test -n "$STAGING_OMNIAI_API_KEY"; test -n "$STAGING_ADMIN_CHAT_ID"
      - name: Prepare staging config
        run: |
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.v107.recheck.jsonc',fs.readFileSync('wrangler.v10-7-staging.template.jsonc','utf8').replace('__D1_DATABASE_ID__','65df37bc-973d-4bfe-a3f4-7c049e570697'));
          NODE
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Deploy exact current V10.7 to staging
        run: npx wrangler deploy --config wrangler.v107.recheck.jsonc
      - name: Rotate staging secrets
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(openssl rand -hex 32)"; SETUP_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$WEBHOOK_SECRET"; echo "::add-mask::$SETUP_KEY"
          echo "STAGING_TELEGRAM_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
          echo "STAGING_SETUP_KEY=$SETUP_KEY" >> "$GITHUB_ENV"
          printf '%s' "$STAGING_TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.v107.recheck.jsonc
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.v107.recheck.jsonc
          printf '%s' "$SETUP_KEY" | npx wrangler secret put SETUP_KEY --config wrangler.v107.recheck.jsonc
          printf '%s' "$STAGING_OMNIAI_API_KEY" | npx wrangler secret put OMNIAI_API_KEY --config wrangler.v107.recheck.jsonc
          printf '%s' "$STAGING_ADMIN_CHAT_ID" | npx wrangler secret put ADMIN_CHAT_ID --config wrangler.v107.recheck.jsonc
          sleep 6
      - name: Initialize exact V10.7 webhook
        run: |
          set -euo pipefail
          KEY="$(node -p 'encodeURIComponent(process.env.STAGING_SETUP_KEY)')"
          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/setup.json -w '%{http_code}' "$STAGING_URL/setup?key=$KEY&force=1" || true)"
            if [ "$CODE" = 200 ] && node -e 'const x=require("/tmp/setup.json");if(!x.ok||!String(x.message||"").includes("10.7"))process.exit(1)' 2>/dev/null; then cat /tmp/setup.json; exit 0; fi
            sleep 2
          done
          cat /tmp/setup.json || true; exit 1
      - name: Reset live queues
        run: npx wrangler d1 execute superagent-v106-staging --remote --config wrangler.v107.recheck.jsonc --command "DELETE FROM runtime_failures WHERE chat_id='$STAGING_ADMIN_CHAT_ID' OR chat_id IS NULL; DELETE FROM telegram_inbox_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID'; DELETE FROM telegram_chat_leases_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID'; DELETE FROM telegram_updates WHERE chat_id='$STAGING_ADMIN_CHAT_ID';"
      - name: Run fresh natural-language live recheck
        run: node tests/v10-7-current-live-recheck.mjs
      - name: Final health
        run: |
          set -euo pipefail
          curl -fsS "$STAGING_URL/health" | tee /tmp/health.json
          node -e 'const x=require("/tmp/health.json");if(!x.ok||!x.db||!x.omniai_service||x.version!=="10.7"||Number(x.recent_failures_1h||0)!==0)process.exit(1)'
