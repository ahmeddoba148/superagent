name: SAND PRIME Turn Debug
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sand-prime-turn-debug.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct normalized PRIME and inspect turn path
        run: |
          set -euo pipefail
          cat sand_prime/final_chunks/part{00..12}.b64 | tr -d '\r\n' | base64 -d | gzip -d > SAND.js
          patch --batch SAND.js < sand_prime/canonical_diff/half0.diff >/dev/null
          patch --batch SAND.js < sand_prime/canonical_diff/half1.diff >/dev/null
          node sand_prime/schema_v5_transform.mjs SAND.js >/dev/null
          test "$(sha256sum SAND.js | awk '{print $1}')" = "294560b072a92186b39549b59fecdc34f35c0b79c4c3a8b09e905a82ed34becc"
          for pattern in 'persistTelegramUpdate' 'handleTelegram' 'drainChat' 'processTelegramUpdate' 'saveAiMessage' 'loadConversation' 'loadMemoryContext' 'chatIngress'; do
            echo "===== $pattern ====="
            grep -n -B 35 -A 90 "$pattern" SAND.js | head -n 260 || true
          done
