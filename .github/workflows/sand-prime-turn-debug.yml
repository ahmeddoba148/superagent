name: SAND PRIME Turn Debug
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sand-prime-turn-debug.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct normalized PRIME and inspect runtime fetch path
        run: |
          set -euo pipefail
          cat sand_prime/final_chunks/part{00..12}.b64 | tr -d '\r\n' | base64 -d | gzip -d > SAND.js
          patch --batch SAND.js < sand_prime/canonical_diff/half0.diff >/dev/null
          patch --batch SAND.js < sand_prime/canonical_diff/half1.diff >/dev/null
          node sand_prime/schema_v5_transform.mjs SAND.js >/dev/null
          test "$(sha256sum SAND.js | awk '{print $1}')" = "294560b072a92186b39549b59fecdc34f35c0b79c4c3a8b09e905a82ed34becc"
          echo '===== redirect error occurrences ====='
          grep -n -B 45 -A 90 'redirect: "error"' SAND.js || true
          echo '===== weather implementation ====='
          grep -n -B 40 -A 160 'weather.lookup' SAND.js | head -n 360 || true
          echo '===== public fetch / SSRF helpers ====='
          grep -n -B 40 -A 180 -E 'safePublic|publicFetch|isPrivateHost|validatePublic|fetchPublic|web.fetch' SAND.js | head -n 500 || true
