name: SAND ONE Production Deploy

on:
  push:
    branches: [sand-one-1.0]
    paths:
      - '.github/workflows/sand-one-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sand-one-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ACCOUNT_ID: 8b619c3555c9bd3068c434ec2cd63785
      WORKER_NAME: superagent
      PROD_URL: https://superagent.ahmeddoba91.workers.dev
      CERTIFIED_SHA256: 17204a5592cc4b6e0700dd4d39d6bcfeafb9c11bfef399cdac36637a45604ea6
      CERTIFIED_VERSION: 1.0.0-dev.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact certified runtime and target account
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [ "$CLOUDFLARE_ACCOUNT_ID" = "$TARGET_ACCOUNT_ID" ]
          test -s SAND_ONE_1.0.js
          actual=$(sha256sum SAND_ONE_1.0.js | awk '{print $1}')
          [ "$actual" = "$CERTIFIED_SHA256" ]
          grep -Fq "const APP_VERSION = \"$CERTIFIED_VERSION\"" SAND_ONE_1.0.js
          node --check SAND_ONE_1.0.js
          echo "CERTIFIED_RUNTIME_OK sha256=$actual"

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest >/dev/null

      - name: Snapshot current production deployment and bindings
        run: |
          set -euo pipefail
          npx wrangler deployments list --name "$WORKER_NAME" --json > /tmp/deployments-before.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/settings-before.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/settings-before.json','utf8'));
          if(!s.success) throw new Error('Cloudflare settings read failed');
          const bindings=s.result?.bindings||[];
          const allowed=new Set(['secret_text','plain_text','d1','service','version_metadata']);
          const unexpected=bindings.filter(b=>!allowed.has(b.type));
          if(unexpected.length) throw new Error('Unexpected production bindings: '+unexpected.map(x=>`${x.name}:${x.type}`).join(','));
          const d1=bindings.filter(b=>b.type==='d1');
          const db=d1.find(b=>b.name==='DB');
          if(!db) throw new Error('Production DB binding not found; refusing deploy');
          const dbid=db.id||db.database_id;
          if(!dbid) throw new Error('Production DB id missing; refusing deploy');
          const services=bindings.filter(b=>b.type==='service');
          const secrets=bindings.filter(b=>b.type==='secret_text').map(b=>b.name);
          const cfg={
            name:process.env.WORKER_NAME,
            main:'SAND_ONE_1.0.js',
            compatibility_date:'2026-08-20',
            compatibility_flags:['global_fetch_strictly_public'],
            keep_vars:true,
            d1_databases:[{binding:'DB',database_id:dbid,database_name:db.database_name||db.name||'production'}],
            services:services.map(b=>({binding:b.name,service:b.service, ...(b.environment?{environment:b.environment}:{})})),
            secrets:{required:secrets}
          };
          if(!cfg.services.some(x=>x.binding==='OMNIAI_SERVICE')) cfg.services.push({binding:'OMNIAI_SERVICE',service:'omniai-engine'});
          fs.writeFileSync('/tmp/wrangler.production.jsonc',JSON.stringify(cfg,null,2));
          fs.writeFileSync('/tmp/bindings-before.json',JSON.stringify(bindings.map(b=>({name:b.name,type:b.type})).sort((a,b)=>a.name.localeCompare(b.name))));
          console.log('PRODUCTION_BINDINGS_OK d1='+d1.length+' services='+cfg.services.length+' secrets='+secrets.length);
          NODE

      - name: Deploy certified runtime to superagent production
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --config /tmp/wrangler.production.jsonc --keep-vars --message "SAND ONE $CERTIFIED_VERSION certified 14/14" | tee /tmp/deploy.log

      - name: Verify production bindings preserved
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" > /tmp/settings-after.json
          node - <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/bindings-before.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/settings-after.json','utf8'));
          if(!s.success) throw new Error('Cloudflare settings verify failed');
          const after=(s.result?.bindings||[]).map(b=>({name:b.name,type:b.type}));
          const keys=new Set(after.map(x=>x.name+':'+x.type));
          const missing=before.filter(x=>!keys.has(x.name+':'+x.type));
          if(missing.length) throw new Error('Bindings lost after deploy: '+missing.map(x=>x.name+':'+x.type).join(','));
          if(!keys.has('DB:d1')) throw new Error('DB binding missing after deploy');
          if(!keys.has('OMNIAI_SERVICE:service')) throw new Error('OMNIAI_SERVICE missing after deploy');
          console.log('PRODUCTION_BINDINGS_PRESERVED');
          NODE

      - name: Verify live production health
        run: |
          set -euo pipefail
          ok=0
          for i in {1..30}; do
            code=$(curl -sS -o /tmp/health -w '%{http_code}' "$PROD_URL/health" || true)
            if [ "$code" = 200 ] && node - <<'NODE'
          const fs=require('fs');
          try {
            const x=JSON.parse(fs.readFileSync('/tmp/health','utf8'));
            process.exit(x.ok===true && x.version===process.env.CERTIFIED_VERSION && x.semantic_routing===true && x.keyword_routing===false ? 0 : 1);
          } catch { process.exit(1); }
          NODE
            then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo 'PRODUCTION_HEALTH_VERIFY_FAILED'
            cat /tmp/health || true
            exit 1
          fi
          cat /tmp/health
          echo 'SAND_ONE_PRODUCTION_DEPLOY_GREEN'

      - name: Automatic rollback on failed verification
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          set +e
          echo 'Verification failed after deploy; rolling back to previous production version.'
          npx wrangler rollback --name "$WORKER_NAME" --message "Automatic rollback after failed SAND ONE production verification"
