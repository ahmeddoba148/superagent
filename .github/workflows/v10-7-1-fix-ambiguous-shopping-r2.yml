name: V10.7.1 Fix Ambiguous Shopping Reference R2

on:
  push:
    branches: [superagent-v10-7-universal-agent]
    paths:
      - '.github/workflows/v10-7-1-fix-ambiguous-shopping-r2.yml'

permissions:
  contents: write

concurrency:
  group: v10-7-1-ambiguity-fix-r2
  cancel-in-progress: false

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      STAGING_OMNIAI_API_KEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      STAGING_URL: https://superagent-v107-staging.ahmeddoba91.workers.dev
      STAGING_DB: superagent-v106-staging
      STAGING_CONFIG: wrangler.v1071.fix.jsonc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Restore certified V10.7 and patch to V10.7.1
        run: |
          set -euo pipefail
          git show ab3ebfd3947ddb541289243c0d5e45266a3fc3e5:SuperAgent_V10_7_Universal_Agent.js > SuperAgent_V10_7_Universal_Agent.js
          python tools/patch-v10-7-1-ambiguity.py
          node --check SuperAgent_V10_7_Universal_Agent.js
          grep -q 'const V10_VERSION="10.7.1"' SuperAgent_V10_7_Universal_Agent.js
          grep -q 'v1071_reference_grounding_guard:true' SuperAgent_V10_7_Universal_Agent.js
          sha256sum SuperAgent_V10_7_Universal_Agent.js | tee /tmp/v1071.sha

      - name: Validate live secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"; test -n "$STAGING_TELEGRAM_BOT_TOKEN"; test -n "$STAGING_OMNIAI_API_KEY"; test -n "$STAGING_ADMIN_CHAT_ID"

      - name: Install Wrangler and prepare config
        run: |
          npm install --no-save wrangler@latest
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.v1071.fix.jsonc',fs.readFileSync('wrangler.v10-7-staging.template.jsonc','utf8').replace('__D1_DATABASE_ID__','65df37bc-973d-4bfe-a3f4-7c049e570697'));
          NODE

      - name: Deploy V10.7.1 to staging
        run: npx wrangler deploy --config wrangler.v1071.fix.jsonc

      - name: Rotate staging secrets
        shell: bash
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(openssl rand -hex 32)"; SETUP_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$WEBHOOK_SECRET"; echo "::add-mask::$SETUP_KEY"
          echo "STAGING_TELEGRAM_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
          printf '%s' "$STAGING_TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.v1071.fix.jsonc
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.v1071.fix.jsonc
          printf '%s' "$SETUP_KEY" | npx wrangler secret put SETUP_KEY --config wrangler.v1071.fix.jsonc
          printf '%s' "$STAGING_OMNIAI_API_KEY" | npx wrangler secret put OMNIAI_API_KEY --config wrangler.v1071.fix.jsonc
          printf '%s' "$STAGING_ADMIN_CHAT_ID" | npx wrangler secret put ADMIN_CHAT_ID --config wrangler.v1071.fix.jsonc
          sleep 5
          curl -fsS "$STAGING_URL/setup?key=$SETUP_KEY&force=1" | tee /tmp/setup.json
          node -e 'const x=require("/tmp/setup.json");if(!x.ok||!String(x.message||"").includes("10.7.1"))process.exit(1)'

      - name: Reset staging state
        run: |
          npx wrangler d1 execute superagent-v106-staging --remote --config wrangler.v1071.fix.jsonc --command "DELETE FROM runtime_failures WHERE chat_id='$STAGING_ADMIN_CHAT_ID' OR chat_id IS NULL; DELETE FROM telegram_inbox_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID'; DELETE FROM telegram_chat_leases_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID'; DELETE FROM telegram_updates WHERE chat_id='$STAGING_ADMIN_CHAT_ID';"

      - name: Run exact live Telegram regression
        run: node tests/v10-7-current-live-recheck.mjs

      - name: Final health
        run: |
          curl -fsS "$STAGING_URL/health" | tee /tmp/health.json
          node -e 'const x=require("/tmp/health.json");if(!x.ok||String(x.version)!=="10.7.1")process.exit(1)'

      - name: Commit verified V10.7.1
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(cut -d' ' -f1 /tmp/v1071.sha)"
          cat > V10_7_1_CERTIFICATE.txt <<EOF
          Super Agent V10.7.1 — Ambiguous Reference Grounding Fix
          Exact live Telegram regression: PASS
          Ambiguous shopping reference: PASS
          Existing focused V10.7 regression: PASS
          Runtime health: PASS
          SHA256: $SHA
          GitHub Actions run: $GITHUB_RUN_ID
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SuperAgent_V10_7_Universal_Agent.js V10_7_1_CERTIFICATE.txt
          git commit -m 'Release V10.7.1 ambiguity-grounded shopping agent'
          git push origin HEAD:superagent-v10-7-universal-agent
