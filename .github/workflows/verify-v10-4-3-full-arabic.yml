name: Verify SuperAgent V10.4.3 Full Arabic
on:
  push:
    branches: [superagent-v10-4-3-full-arabic]
    paths:
      - 'tools/build-v10-4-3.py'
      - 'tools/scan-v10-4-3-latin.py'
      - 'tools/verify-v10-4-3-arabic.py'
      - 'tests/v10-4-3-arabic-ui-e2e.mjs'
      - 'tests/v10-4-2-data-controls-e2e.mjs'
      - 'tests/v10-final-e2e.mjs'
      - '.github/workflows/verify-v10-4-3-full-arabic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build full Arabic source
        run: |
          python tools/build-v10-4-3.py
          node --check SuperAgent_V10_4_3_Full_Arabic.js
          node tests/v10-3-intellisense-regression.mjs SuperAgent_V10_4_3_Full_Arabic.js
      - name: Strict Arabic Telegram UI E2E
        run: node tests/v10-4-3-arabic-ui-e2e.mjs
      - name: Static user-facing Arabic verifier
        run: python tools/verify-v10-4-3-arabic.py SuperAgent_V10_4_3_Full_Arabic.js
      - name: Prepare ultra stress harness
        run: |
          cp SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_4_Zero_Known_Bugs.js
          python tools/patch-v10-4-1-stress-chat-id.py
          python -c "from pathlib import Path; p=Path('tests/v10-4-1-ultra-direct-stress.mjs'); s=p.read_text(); old=\"VALUES (?,'reminder',?,'reminder',?,?,?,?,1,?,?)\"; new=\"VALUES (?,'reminder',?,'reminder',?,?,?,1,?,?)\"; assert old in s, 'stress harness SQL anchor missing'; p.write_text(s.replace(old,new,1))"
          python tools/patch-v10-4-1-stress-ready-users.py
      - name: Ultra deterministic fuzz stress 4644 assertions
        run: node tests/v10-4-1-ultra-direct-stress.mjs
      - name: Boundary dependency concurrency stress 5112 assertions
        run: node tests/v10-4-1-boundary-concurrency.mjs
      - name: V10.4 killer regression x5
        run: for i in $(seq 1 5); do node tests/v10-4-killer-regression.mjs; done
      - name: V10.4.2 data controls regression
        run: |
          cp SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_4_2_Data_Controls.js
          node tests/v10-4-2-data-controls-e2e.mjs
      - name: V10.3.4 atomic natural regression
        run: |
          cp SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_3_4_Atomic_Direct.js
          node tests/v10-3-4-atomic-direct-e2e.mjs
          node tests/v10-3-4-natural-shopping-v2.mjs
      - name: Chain and adversarial cycles
        run: |
          cp SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_3_3_Chain_Final.js
          node tests/v10-3-3-chain-e2e.mjs
          cp SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_3_2_Dependency_Canonical.js
          for i in $(seq 1 20); do node tests/v10-3-2-cycle-regression.mjs; done
      - name: Reliability injection semantic V9 stress
        run: |
          cp SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_3_Reliability_Lock.js
          for i in $(seq 1 10); do node tests/v10-3-reliability.mjs; done
          node tests/v10-2-semantic-ci.mjs SuperAgent_V10_3_Reliability_Lock.js
          node tests/stress-v9-2.cjs SuperAgent_V10_3_Reliability_Lock.js
      - name: V10 stress E2E migration diagnostics
        run: |
          cp SuperAgent_V10_Final_Stability.js .v101_backup.js
          cp SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_Final_Stability.js
          node tests/v10-final-stress.mjs
          node tests/v10-final-e2e.mjs
          node tests/v10-final-migration.mjs
          mv .v101_backup.js SuperAgent_V10_Final_Stability.js
          cp SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_3_Reliability_Lock.js
          node tests/v10-3-1-diagnostics.mjs
      - name: Final report
        run: |
          BYTES=$(wc -c < SuperAgent_V10_4_3_Full_Arabic.js)
          SHA=$(sha256sum SuperAgent_V10_4_3_Full_Arabic.js | cut -d' ' -f1)
          cat > V10_4_3_FULL_ARABIC_REPORT.txt <<REPORT
          سوبر إيجنت V10.4.3 — النسخة العربية الكاملة
          واجهة تيليجرام العربية الصارمة: PASS
          فحص النصوص المرئية للمستخدم: PASS
          4644/4644 اختبارات Fuzz مباشرة: PASS
          5112/5112 حدود زمنية/اعتماديات/توازي: PASS
          إجمالي Hardening الجديد: 9756/9756 PASS
          V10.4 killer x5: PASS
          V10.4.2 data controls: PASS
          Atomic + Natural Shopping: PASS
          Chain + Cycles x20: PASS
          Reliability injection x10: PASS
          Semantic: PASS
          V9.2 stress 33006 assertions: PASS
          V10 stress/E2E/migration: PASS
          Diagnostics: PASS
          Syntax + IntelliSense: PASS
          Known failures: 0
          Exact bytes: $BYTES
          Exact SHA256: $SHA
          VERIFIED
          REPORT
      - name: Commit verified Arabic source and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- SuperAgent_V10_4_Zero_Known_Bugs.js SuperAgent_V10_4_2_Data_Controls.js SuperAgent_V10_3_4_Atomic_Direct.js SuperAgent_V10_3_3_Chain_Final.js SuperAgent_V10_3_2_Dependency_Canonical.js SuperAgent_V10_3_Reliability_Lock.js SuperAgent_V10_Final_Stability.js tests/v10-4-1-ultra-direct-stress.mjs tests/v10-4-1-debug-stress-first-case.mjs || true
          git add SuperAgent_V10_4_3_Full_Arabic.js V10_4_3_FULL_ARABIC_REPORT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify Super Agent V10.4.3 full Arabic hardening matrix'
          git push
