name: V11.3 Live Fixed Telegram Certification

on:
  push:
    branches: [superagent-v11-3-live-test]
    paths:
      - '.github/workflows/v11-3-live-fixed-certify.yml'
      - 'tools/apply_v113_live_fixes.mjs'
  workflow_dispatch:

jobs:
  live-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      STAGING_OMNIAI_API_KEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      URL: https://superagent-v113-staging.ahmeddoba91.workers.dev
      DB: superagent-v106-staging
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Rebuild exact V11.3 then apply live fixes
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v113_patch_payload.part{0,1,2,3} > /tmp/v113.b64
          base64 -d /tmp/v113.b64 | gunzip > /tmp/v113.patch
          patch -o SuperAgent_V11_3_FULL.js SuperAgent_V11_2_FULL.js < /tmp/v113.patch
          test "$(sha256sum SuperAgent_V11_3_FULL.js | awk '{print $1}')" = "d6f4d0fe093aad8699331df2083db7e0d763f448d396135c11e4622b44ddd825"
          node tools/apply_v113_live_fixes.mjs SuperAgent_V11_3_FULL.js
          node --check SuperAgent_V11_3_FULL.js
          cp SuperAgent_V11_3_FULL.js /tmp/v113.mjs
          node -e "import('/tmp/v113.mjs').then(()=>console.log('module-load PASS'))"
          echo "FIXED_SHA=$(sha256sum SuperAgent_V11_3_FULL.js | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Install Wrangler and deploy isolated staging
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save wrangler@latest
          cat > wrangler.v113.live.jsonc <<'EOF'
          {
            "$schema":"./node_modules/wrangler/config-schema.json",
            "name":"superagent-v113-staging",
            "main":"SuperAgent_V11_3_FULL.js",
            "compatibility_date":"2026-08-16",
            "vars":{"PUBLIC_BOT":"false","V113_STAGING_BUILD":"live-fixed-cert"},
            "d1_databases":[{"binding":"DB","database_name":"superagent-v106-staging","database_id":"65df37bc-973d-4bfe-a3f4-7c049e570697"}],
            "services":[{"binding":"OMNIAI_SERVICE","service":"omniai-engine"}],
            "triggers":{"crons":["* * * * *"]}
          }
          EOF
          npx wrangler deploy --config wrangler.v113.live.jsonc
          export WEBHOOK_SECRET="$(openssl rand -hex 32)" SETUP_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$WEBHOOK_SECRET"; echo "::add-mask::$SETUP_KEY"
          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
          echo "SETUP_KEY=$SETUP_KEY" >> "$GITHUB_ENV"
          for pair in \
            "TELEGRAM_BOT_TOKEN:$STAGING_TELEGRAM_BOT_TOKEN" \
            "OMNIAI_API_KEY:$STAGING_OMNIAI_API_KEY" \
            "ADMIN_CHAT_ID:$STAGING_ADMIN_CHAT_ID" \
            "ALLOWED_CHAT_IDS:$STAGING_ADMIN_CHAT_ID" \
            "TELEGRAM_WEBHOOK_SECRET:$WEBHOOK_SECRET" \
            "SETUP_KEY:$SETUP_KEY"; do
              k="${pair%%:*}"; v="${pair#*:}"; printf '%s' "$v" | npx wrangler secret put "$k" --config wrangler.v113.live.jsonc >/dev/null
          done
          sleep 5
          curl -fsS "$URL/setup?key=$SETUP_KEY&force=1" | tee /tmp/setup.json
          node -e "const x=require('/tmp/setup.json');if(!x.ok||x.message!=='سوبر إيجنت V11.3 جاهز للعمل'||x.fallback_count!==2||!Array.isArray(x.fallback_models))process.exit(1)"
          curl -fsS "$URL/health" | tee /tmp/health.json
          node -e "const x=require('/tmp/health.json');if(!x.ok||x.version!=='11.3.0'||!x.db||!x.omniai_service)process.exit(1)"
          curl -fsS "$URL/ready?key=$SETUP_KEY" | tee /tmp/ready.json
          node -e "const x=require('/tmp/ready.json');if(!x.ok||!x.db||!x.omniai)process.exit(1)"
          curl -fsS "$URL/selftest?key=$SETUP_KEY" | tee /tmp/selftest.json
          node -e "const x=require('/tmp/selftest.json');if(!x.ok||!x.v10.ok||!x.v11.ok||!x.v113.ok)process.exit(1)"
      - name: Real Telegram webhook + D1 scenario matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/live.mjs <<'NODE'
          import {execFileSync} from 'node:child_process';
          const URL=process.env.URL, DB=process.env.DB, CHAT=String(process.env.STAGING_ADMIN_CHAT_ID), SECRET=process.env.WEBHOOK_SECRET;
          const cfg='wrangler.v113.live.jsonc'; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const esc=s=>String(s).replaceAll("'","''");
          function q(sql){const out=execFileSync('npx',['wrangler','d1','execute',DB,'--remote','--config',cfg,'--command',sql],{encoding:'utf8'});const a=JSON.parse(out.slice(out.indexOf('[')));return a?.[0]?.results||[];}
          const started=new Date().toISOString(); let seq=1800000000+(Date.now()%10000000); let msg=700000;
          async function post(text,id=++seq){const body={update_id:id,message:{message_id:++msg,date:Math.floor(Date.now()/1000),chat:{id:Number(CHAT),type:'private'},from:{id:Number(CHAT),is_bot:false,first_name:'LiveTest'},text}};const t=Date.now();const r=await fetch(URL+'/telegram',{method:'POST',headers:{'content-type':'application/json','X-Telegram-Bot-Api-Secret-Token':SECRET},body:JSON.stringify(body)});if(!r.ok)throw new Error('webhook HTTP '+r.status);return{id,t};}
          async function wait(id,max=30000){const end=Date.now()+max;let last;while(Date.now()<end){last=q(`SELECT status,attempts,last_error FROM telegram_inbox_v106 WHERE update_id='${id}' LIMIT 1`)[0];if(last?.status==='done')return last;if(last?.status==='failed')throw new Error(`terminal ${id}: ${last.last_error||''}`);await sleep(350);}throw new Error(`timeout ${id} ${JSON.stringify(last)}`);}
          function ok(name,cond,detail=''){if(!cond)throw new Error(`FAIL ${name}: ${detail}`);console.log(`PASS ${name}${detail?' '+detail:''}`);}
          q(`DELETE FROM shopping_sessions WHERE chat_id='${esc(CHAT)}'; DELETE FROM smart_list_items WHERE chat_id='${esc(CHAT)}'; DELETE FROM smart_lists WHERE chat_id='${esc(CHAT)}'; DELETE FROM reminders WHERE chat_id='${esc(CHAT)}' AND title LIKE '%V113-LIVE%';`);
          let x=await post('انت اسمك اي'); let r=await wait(x.id); ok('identity',r.attempts===1,`attempts=${r.attempts} ms=${Date.now()-x.t}`);
          x=await post('عامل اي'); r=await wait(x.id); ok('casual Egyptian chat',r.attempts===1,`attempts=${r.attempts} ms=${Date.now()-x.t}`);
          const list='بص عاوز اشتري\nعيش تورتيلا\nعيش توست\nفينو اسود\nفصوص رومي\nشيدر طبيعي\nكاجو\nفستق\nكوفي شيك\nحليب دينا\nايس كريم دينا\nوبطاطس طبيعية';
          x=await post(list); r=await wait(x.id); const items=q(`SELECT title FROM smart_list_items WHERE chat_id='${esc(CHAT)}' AND status='pending' ORDER BY normalized_title`); ok('11-item shopping exact count',items.length===11,JSON.stringify(items.map(v=>v.title))); ok('11-item shopping first attempt',r.attempts===1,`attempts=${r.attempts} ms=${Date.now()-x.t}`);
          x=await post('فكرني يوم 20 أكتوبر 2026 الساعة 6:17 مساء أراجع V113-LIVE-SINGLE'); r=await wait(x.id,35000); let rem=q(`SELECT title,local_date,local_time FROM reminders WHERE chat_id='${esc(CHAT)}' AND title='أراجع V113-LIVE-SINGLE' AND cancelled=0`); ok('structured reminder persisted once',rem.length===1&&rem[0].local_date==='2026-10-20'&&rem[0].local_time==='18:17',JSON.stringify(rem)); ok('structured reminder bounded retry',Number(r.attempts)<=2,`attempts=${r.attempts} ms=${Date.now()-x.t}`);
          const dupId=++seq; const text='فكرني يوم 21 أكتوبر 2026 الساعة 6:19 مساء أراجع V113-LIVE-IDEMP'; const t=Date.now(); await Promise.all([post(text,dupId),post(text,dupId)]); r=await wait(dupId,35000); rem=q(`SELECT title,local_date,local_time FROM reminders WHERE chat_id='${esc(CHAT)}' AND title='أراجع V113-LIVE-IDEMP' AND cancelled=0`); ok('same update id exactly once',rem.length===1,`rows=${rem.length} attempts=${r.attempts} ms=${Date.now()-t}`);
          const burst=['/shopping','/today','صباح الفل']; const sent=await Promise.all(burst.map(v=>post(v))); const done=[]; for(const z of sent)done.push(await wait(z.id,30000)); ok('same-chat burst drains',done.every(v=>v.status==='done'),JSON.stringify(done.map(v=>v.attempts)));
          const failures=q(`SELECT scope,error_text,created_at FROM runtime_failures WHERE created_at>='${started}' ORDER BY id`); console.log('RUNTIME_FAILURES',JSON.stringify(failures));
          const stats=q(`SELECT model_id,last_latency_ms,last_error,updated_at FROM model_stats WHERE model_id IN ('groq::openai/gpt-oss-20b','gemini::gemini-3.5-flash-lite','groq::qwen/qwen3.6-27b') ORDER BY updated_at DESC`); console.log('MODEL_STATS',JSON.stringify(stats));
          const report={ok:true,version:'11.3.0',fixed_sha:process.env.FIXED_SHA,started,finished:new Date().toISOString(),shopping_items:items.length,reminder_single:rem.length,burst_attempts:done.map(v=>v.attempts),runtime_failures:failures,model_stats:stats};
          await import('node:fs').then(fs=>fs.writeFileSync('V11_3_LIVE_FIXED_REPORT.json',JSON.stringify(report,null,2)));
          NODE
          node /tmp/live.mjs
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: SuperAgent-V11.3-Live-Fixed-Evidence
          retention-days: 30
          path: V11_3_LIVE_FIXED_REPORT.json
