name: SAND V1 PR Live Test
on:
  pull_request:
    branches: [main]
    paths:
      - 'sand_test_parts/**'
      - '.github/workflows/sand-v1-pr-live.yml'
permissions:
  contents: read
concurrency:
  group: sand-v1-pr-live
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      OKEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      CHAT: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      URL: https://sand-v1-ai-staging.ahmeddoba91.workers.dev
      DB: superagent-v106-staging
      CFG: wrangler.sand.jsonc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble exact source
        run: |
          set -euo pipefail
          cat sand_test_parts/part*.js.txt > SAND.js
          test "$(sha256sum SAND.js|awk '{print $1}')" = "a8c9fa912784f5060507f0e81602e00d470bbb379592e201fa8c4d3e92002037"
          node --check SAND.js
      - name: Probe selected models
        run: |
          set -euo pipefail
          node - <<'NODE'
          const key=process.env.OKEY,ep='https://omniai-engine.ahmeddoba91.workers.dev/v1/chat/completions';
          const ms=['groq::openai/gpt-oss-120b','groq::qwen/qwen3.6-27b','gemini::gemini-3.5-flash-lite'];
          if(!key)throw Error('staging OmniAI key missing');
          async function p(model){const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000),t=Date.now();try{const r=await fetch(ep,{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model,messages:[{role:'user',content:'رد OK فقط'}],max_tokens:24,stream:false}),signal:c.signal});const raw=await r.text();return{model,ok:r.ok&&raw.length>0,status:r.status,ms:Date.now()-t,body:raw.slice(0,160)}}catch(e){return{model,ok:false,status:0,ms:Date.now()-t,error:String(e?.message||e)}}finally{clearTimeout(tm)}}
          (async()=>{let a=[];for(const m of ms)a.push(await p(m));console.log(JSON.stringify(a,null,2));if(!a.every(x=>x.ok))throw Error('model probe failed')})();
          NODE
      - name: Deploy isolated staging
        run: |
          set -euo pipefail
          test -n "$BOT"; test -n "$OKEY"; test -n "$CHAT"
          npm install --no-save wrangler@latest >/dev/null
          cat > "$CFG" <<'EOF'
          {"name":"sand-v1-ai-staging","main":"SAND.js","compatibility_date":"2026-08-18","vars":{"PUBLIC_BOT":"false"},"d1_databases":[{"binding":"DB","database_name":"superagent-v106-staging","database_id":"65df37bc-973d-4bfe-a3f4-7c049e570697"}],"services":[{"binding":"OMNIAI_SERVICE","service":"omniai-engine"}]}
          EOF
          npx wrangler deploy --config "$CFG" >/dev/null
          W=$(openssl rand -hex 32); K=$(openssl rand -hex 32)
          echo "::add-mask::$W"; echo "::add-mask::$K"
          echo "W=$W" >> "$GITHUB_ENV"; echo "K=$K" >> "$GITHUB_ENV"
          for p in "TELEGRAM_BOT_TOKEN:$BOT" "OMNIAI_API_KEY:$OKEY" "TELEGRAM_WEBHOOK_SECRET:$W" "SETUP_KEY:$K" "ALLOWED_CHAT_ID:$CHAT"; do n=${p%%:*};v=${p#*:};printf '%s' "$v"|npx wrangler secret put "$n" --config "$CFG" >/dev/null;done
      - name: Health and setup
        run: |
          set -euo pipefail
          for i in {1..10};do code=$(curl -sS -o /tmp/h -w '%{http_code}' "$URL/health"||true);[ "$code" = 200 ]&&break;sleep 2;done
          cat /tmp/h
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/h"));if(!x.ok||x.schema_version!=="2"||!x.bindings?.OMNIAI_SERVICE)throw Error(JSON.stringify(x))'
          curl -fsS -X POST -H "X-Sand-Key: $K" "$URL/setup" >/tmp/s
          cat /tmp/s
      - name: Rapid queue live test
        run: |
          set -euo pipefail
          SQL="DELETE FROM sand_core_chat_leases WHERE chat_id='$CHAT';DELETE FROM sand_core_inbox WHERE chat_id='$CHAT';DELETE FROM sand_ai_messages WHERE chat_id='$CHAT';DELETE FROM sand_ai_calls WHERE chat_id='$CHAT';"
          npx wrangler d1 execute "$DB" --remote --config "$CFG" --command "$SQL" >/dev/null
          node - <<'NODE'
          const {execFileSync}=require('child_process');const U=process.env.URL,C=process.env.CHAT,S=process.env.W,D=process.env.DB,cfg=process.env.CFG,sleep=m=>new Promise(r=>setTimeout(r,m));const b=3200000000+(Date.now()%10000000),ts=['اختبار سند واحد: رد تمام فقط','اختبار سند اتنين: الرسالة اللي قبلي رقم كام؟','اختبار سند تلاتة: النهاردة كام في القاهرة؟'];
          async function post(id,text){const body={update_id:id,message:{message_id:id%999999,date:Math.floor(Date.now()/1000),chat:{id:Number(C),type:'private'},from:{id:Number(C),is_bot:false,first_name:'SAND-CI'},text}};const r=await fetch(U+'/telegram',{method:'POST',headers:{'content-type':'application/json','X-Telegram-Bot-Api-Secret-Token':S},body:JSON.stringify(body)});if(!r.ok)throw Error('webhook '+r.status)}
          function q(sql){return JSON.parse(execFileSync('npx',['wrangler','d1','execute',D,'--remote','--config',cfg,'--command',sql,'--json'],{encoding:'utf8'}))?.[0]?.results||[]}
          (async()=>{await Promise.all(ts.map((t,i)=>post(b+i,t)));await post(b,ts[0]);let inbox=[],msg=[];for(let i=0;i<30;i++){await sleep(1000);inbox=q(`SELECT update_id,status,attempts,last_error FROM sand_core_inbox WHERE update_id BETWEEN ${b} AND ${b+2} ORDER BY update_id`);msg=q(`SELECT update_id,role,model_id,content FROM sand_ai_messages WHERE update_id BETWEEN ${b} AND ${b+2} ORDER BY update_id,id`);if(inbox.length===3&&inbox.every(x=>x.status==='done')&&msg.filter(x=>x.role==='assistant').length===3)break}const u=msg.filter(x=>x.role==='user'),a=msg.filter(x=>x.role==='assistant'),calls=q(`SELECT update_id,model_id,model_role,ok,http_status,error_code,latency_ms FROM sand_ai_calls WHERE update_id BETWEEN ${b} AND ${b+2} ORDER BY id`);const out={inbox,users:u,assistants:a,calls};console.log(JSON.stringify(out,null,2));if(inbox.length!==3||!inbox.every(x=>x.status==='done')||u.length!==3||a.length!==3)throw Error('live queue failed');if(new Set(u.map(x=>x.update_id)).size!==3||new Set(a.map(x=>x.update_id)).size!==3)throw Error('duplicate processing')})();
          NODE
      - name: No deadlock
        run: |
          set -euo pipefail
          curl -fsS -H "X-Sand-Key: $K" "$URL/admin/status" >/tmp/st
          cat /tmp/st
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/st"));const bad=(x.counts||[]).filter(r=>["pending","processing"].includes(r.status)&&Number(r.count)>0);if(!x.ok||bad.length)throw Error(JSON.stringify(x))'
