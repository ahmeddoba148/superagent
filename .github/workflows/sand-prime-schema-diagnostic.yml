name: SAND PRIME Schema Diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'sand_prime/**'
      - '.github/workflows/sand-prime-schema-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical PRIME and show migration context
        run: |
          set -euo pipefail
          cat sand_prime/final_chunks/part{00..12}.b64 | tr -d '\r\n' | base64 -d | gzip -d > SAND.js
          test "$(sha256sum SAND.js | awk '{print $1}')" = "6d3df0dcc5880f0620f440effd1afc5d140d72bebd878cb1a0cb571eb0f04c45"
          patch --batch SAND.js < sand_prime/canonical_diff/half0.diff >/dev/null
          patch --batch SAND.js < sand_prime/canonical_diff/half1.diff >/dev/null
          test "$(sha256sum SAND.js | awk '{print $1}')" = "8f41ce84e6c07104907041d297ce27c6ac143361d6211a38db05e394c56897ea"
          echo '===== CORE SCHEMA CONTEXT ====='
          grep -n -B 35 -A 45 'Unsupported core schema version' SAND.js
          echo '===== META / MIGRATION REFERENCES ====='
          grep -n -E 'CORE_SCHEMA_VERSION|schema_version|ensureCoreSchema|migrat|coreMeta' SAND.js | head -n 120
