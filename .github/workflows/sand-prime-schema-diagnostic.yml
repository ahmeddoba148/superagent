name: SAND PRIME Schema Diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - 'sand_prime/**'
      - '.github/workflows/sand-prime-schema-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical PRIME and compare core schema v4
        run: |
          set -euo pipefail
          cat sand_prime/final_chunks/part{00..12}.b64 | tr -d '\r\n' | base64 -d | gzip -d > SAND.js
          test "$(sha256sum SAND.js | awk '{print $1}')" = "6d3df0dcc5880f0620f440effd1afc5d140d72bebd878cb1a0cb571eb0f04c45"
          patch --batch SAND.js < sand_prime/canonical_diff/half0.diff >/dev/null
          patch --batch SAND.js < sand_prime/canonical_diff/half1.diff >/dev/null
          test "$(sha256sum SAND.js | awk '{print $1}')" = "8f41ce84e6c07104907041d297ce27c6ac143361d6211a38db05e394c56897ea"
          echo '===== PRIME CORE SCHEMA CONTEXT ====='
          grep -n -B 35 -A 45 'Unsupported core schema version' SAND.js
          echo '===== FETCH REMINDER SCHEMA V4 SOURCE ====='
          git fetch --depth=1 origin sand-v1-reminder-live-test
          for f in part1.b64 part2.b64 part3.b64 part4a.b64 part4b.b64 part4c.b64 part4d.b64; do git show "FETCH_HEAD:sand_reminder_live/$f"; done | tr -d '\r\n' | base64 -d | gzip -d > REMINDER.js
          test "$(sha256sum REMINDER.js | awk '{print $1}')" = "d880020f263d527a206165345a1fd345e8e3f0938ad98e3a834b596328a53fd4"
          echo '===== REMINDER V4 MIGRATION CONTEXT ====='
          grep -n -B 25 -A 65 -E 'migrateCoreV4|CORE_SCHEMA_VERSION|schema_version' REMINDER.js | head -n 260
          echo '===== CORE TABLE REFERENCES IN V4 ====='
          grep -n -E 'sand_core_|chatIngress|inbox|coreMeta' REMINDER.js | head -n 180
