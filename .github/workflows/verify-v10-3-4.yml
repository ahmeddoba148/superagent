name: Verify SuperAgent V10.3.4 Atomic Direct
on:
  push:
    branches: [superagent-v10-3-4-atomic-direct]
    paths:
      - 'tools/build-v10-3-4.py'
      - 'tests/v10-3-4-atomic-direct-e2e.mjs'
      - 'tests/v10-3-4-natural-shopping.mjs'
      - '.github/workflows/verify-v10-3-4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build V10.3.4
        run: python tools/build-v10-3-4.py
      - name: Syntax and IntelliSense
        run: |
          node --check SuperAgent_V10_3_4_Atomic_Direct.js
          node tests/v10-3-intellisense-regression.mjs SuperAgent_V10_3_4_Atomic_Direct.js
      - name: Atomic direct E2E
        run: node tests/v10-3-4-atomic-direct-e2e.mjs
      - name: Natural shopping and delete E2E
        run: node tests/v10-3-4-natural-shopping.mjs
      - name: V10.3.3 chain regression
        run: |
          cp SuperAgent_V10_3_4_Atomic_Direct.js SuperAgent_V10_3_3_Chain_Final.js
          node tests/v10-3-3-chain-e2e.mjs
      - name: Cycle canonicalization regression
        run: |
          cp SuperAgent_V10_3_4_Atomic_Direct.js SuperAgent_V10_3_2_Dependency_Canonical.js
          node tests/v10-3-2-cycle-regression.mjs
      - name: Reliability regression
        run: |
          cp SuperAgent_V10_3_4_Atomic_Direct.js SuperAgent_V10_3_Reliability_Lock.js
          node tests/v10-3-reliability.mjs
      - name: Semantic regression
        run: node tests/v10-2-semantic-ci.mjs SuperAgent_V10_3_Reliability_Lock.js
      - name: V9.2 stress regression
        run: node tests/stress-v9-2.cjs SuperAgent_V10_3_Reliability_Lock.js
      - name: V10 compatibility stress E2E migration
        run: |
          cp SuperAgent_V10_Final_Stability.js .v101_backup.js
          cp SuperAgent_V10_3_4_Atomic_Direct.js SuperAgent_V10_Final_Stability.js
          node tests/v10-final-stress.mjs
          node tests/v10-final-e2e.mjs
          node tests/v10-final-migration.mjs
          mv .v101_backup.js SuperAgent_V10_Final_Stability.js
      - name: Protected diagnostics regression
        run: |
          cp SuperAgent_V10_3_4_Atomic_Direct.js SuperAgent_V10_3_Reliability_Lock.js
          node tests/v10-3-1-diagnostics.mjs
      - name: Write report
        run: |
          BYTES=$(wc -c < SuperAgent_V10_3_4_Atomic_Direct.js)
          SHA=$(sha256sum SuperAgent_V10_3_4_Atomic_Direct.js | cut -d' ' -f1)
          cat > V10_3_4_FINAL_REPORT.txt <<REPORT
          Super Agent V10.3.4 Atomic Direct
          Syntax + IntelliSense: PASS
          Compound conflict atomic rollback/replay: PASS
          Deterministic recurring delete with AI unavailable: PASS
          Ambiguous recurring delete asks instead of guessing: PASS
          Natural shopping language: PASS
          Delete shopping item + undo: PASS
          Delete whole shopping list + undo: PASS
          Relation-derived duplicate alerts removed: PASS
          V10.3.3 chain regression: PASS
          Cycle canonicalization regression: PASS
          Reliability failure injection: PASS
          Semantic regression: PASS
          V9.2 stress regression: PASS
          V10 stress/E2E/migration: PASS
          Protected diagnostics: PASS
          Exact bytes: $BYTES
          Exact SHA256: $SHA
          VERIFIED
          REPORT
      - name: Commit verified source and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- SuperAgent_V10_3_3_Chain_Final.js SuperAgent_V10_3_2_Dependency_Canonical.js SuperAgent_V10_3_Reliability_Lock.js SuperAgent_V10_Final_Stability.js || true
          git add SuperAgent_V10_3_4_Atomic_Direct.js V10_3_4_FINAL_REPORT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify V10.3.4 atomic direct full regression'
          git push
