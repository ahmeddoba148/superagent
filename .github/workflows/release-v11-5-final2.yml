name: Final2 SuperAgent V11.5 Certification
on:
  push:
    branches: [superagent-v11-5-hardening]
    paths: ['.github/workflows/release-v11-5-final2.yml']
permissions:
  contents: write
jobs:
  final2-v115:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      STAGING_OMNIAI_API_KEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      URL: https://superagent-v115-staging.ahmeddoba91.workers.dev
      DB: superagent-v106-staging
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build and certify source
        shell: bash
        run: |
          set -euo pipefail
          node tools/build_v11_5.mjs SuperAgent_V11_4_FULL.js SuperAgent_V11_5_FULL.js
          node --check SuperAgent_V11_5_FULL.js
          cp SuperAgent_V11_5_FULL.js /tmp/v115.mjs; node -e "import('/tmp/v115.mjs').then(()=>console.log('module-load PASS'))"
          V115_SHA="$(sha256sum SuperAgent_V11_5_FULL.js|awk '{print $1}')"; echo "V115_SHA=$V115_SHA" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('fs');const b=fs.readFileSync('SuperAgent_V11_4_FULL.js','utf8'),o=fs.readFileSync('SuperAgent_V11_5_FULL.js','utf8');const funcs=s=>new Set([...s.matchAll(/(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(x=>x[1])),tabs=s=>new Set([...s.matchAll(/CREATE TABLE IF NOT EXISTS\s+([A-Za-z0-9_]+)/gi)].map(x=>x[1]));const bf=funcs(b),of=funcs(o),bt=tabs(b),ot=tabs(o),mf=[...bf].filter(x=>!of.has(x)),mt=[...bt].filter(x=>!ot.has(x));const m=o.match(/const MODEL_CHAIN=\[([\s\S]*?)\n\];\nconst PRIMARY_MODEL/),ids=[...m[1].matchAll(/id:"([^"]+)"/g)].map(x=>x[1]),exp=['gemini::gemini-3.5-flash-lite','gemini::gemini-3.1-flash-lite','gemini::gemini-flash-lite-latest'];const checks={models:JSON.stringify(ids)===JSON.stringify(exp),budget:o.includes('const TOTAL_AI_BUDGET_MS=10000;'),router:o.includes('v11_semantic_router:false'),headers:o.includes('X-SuperAgent-Key')&&!o.includes('searchParams.get("key")'),heartbeat:o.includes('V115_QUEUE_HEARTBEAT_MS=8000'),voice:o.includes('V115_VOICE_TOTAL_BUDGET_MS=20000'),current:o.includes('مين رئيس مصر؟'),personal:o.includes('needsPersonalizationContextV115'),purge:o.includes('purgeTransportForChatV115'),schema:o.includes('ensureRuntimeSchemaReadyV115'),brief:o.includes("clockInWindowV115(now.time,'08:00','08:09')"),holiday:o.includes('if(!successful){const stale=await cacheGetAnyV113'),timeout:o.includes('Timeout بعد ${attemptMs}ms'),noMissingFunctions:!mf.length,noMissingTables:!mt.length};const failed=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);if(failed.length)throw Error(JSON.stringify({failed,ids,mf,mt}));const c=JSON.parse(fs.readFileSync('V11_5_CERTIFICATION.json'));Object.assign(c,{base_v114_functions:bf.size,retained_v114_functions:[...bf].filter(x=>of.has(x)).length,missing_functions:mf,base_v114_tables:bt.size,retained_v114_tables:[...bt].filter(x=>ot.has(x)).length,missing_tables:mt,checks,failed_checks:failed});fs.writeFileSync('V11_5_CERTIFICATION.json',JSON.stringify(c,null,2));console.log(JSON.stringify(checks));
          NODE
          cp SuperAgent_V11_5_FULL.js /tmp/self.mjs; printf '\nconsole.log(JSON.stringify({v10:runV10SelfTests(),v11:runV11PureSelfTests(),v113:runV113PureSelfTests(),v114:runV114PureSelfTests(),v115:runV115PureSelfTests()}));\n' >> /tmp/self.mjs
          node /tmp/self.mjs | tail -1 | tee /tmp/self.json
          node -e "const x=require('/tmp/self.json');for(const k of Object.keys(x))if(!x[k].ok)throw Error(k+' '+JSON.stringify(x[k]))"
      - name: Deploy staging and configure secrets
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save wrangler@latest >/dev/null
          cat > wrangler.v115.final2.jsonc <<'EOF'
          {"name":"superagent-v115-staging","main":"SuperAgent_V11_5_FULL.js","compatibility_date":"2026-08-17","vars":{"PUBLIC_BOT":"false","V115_STAGING_BUILD":"final2"},"d1_databases":[{"binding":"DB","database_name":"superagent-v106-staging","database_id":"65df37bc-973d-4bfe-a3f4-7c049e570697"}],"services":[{"binding":"OMNIAI_SERVICE","service":"omniai-engine"}]}
          EOF
          npx wrangler deploy --config wrangler.v115.final2.jsonc >/dev/null
          WEBHOOK_SECRET="$(openssl rand -hex 32)";SETUP_KEY="$(openssl rand -hex 32)";echo "::add-mask::$WEBHOOK_SECRET";echo "::add-mask::$SETUP_KEY";echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV";echo "SETUP_KEY=$SETUP_KEY" >> "$GITHUB_ENV"
          for pair in "TELEGRAM_BOT_TOKEN:$STAGING_TELEGRAM_BOT_TOKEN" "OMNIAI_API_KEY:$STAGING_OMNIAI_API_KEY" "ADMIN_CHAT_ID:$STAGING_ADMIN_CHAT_ID" "ALLOWED_CHAT_IDS:$STAGING_ADMIN_CHAT_ID" "TELEGRAM_WEBHOOK_SECRET:$WEBHOOK_SECRET" "SETUP_KEY:$SETUP_KEY";do k="${pair%%:*}";v="${pair#*:}";printf '%s' "$v"|npx wrangler secret put "$k" --config wrangler.v115.final2.jsonc >/dev/null;done
          sleep 6
      - name: Security setup readiness and selftest
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/q -w '%{http_code}' "$URL/ready?key=$SETUP_KEY")" = 401
          good=0;for i in 1 2 3 4 5 6;do code=$(curl -sS -o /tmp/setup -w '%{http_code}' -X POST -H "X-SuperAgent-Key: $SETUP_KEY" "$URL/setup?force=1"||true);if [ "$code" = 200 ];then good=1;break;fi;sleep 3;done;test "$good" = 1
          node -e "const x=require('/tmp/setup'),e=['gemini::gemini-3.1-flash-lite','gemini::gemini-flash-lite-latest'];if(!x.ok||x.message!=='سوبر إيجنت V11.5 جاهز للعمل'||x.primary_model!=='gemini::gemini-3.5-flash-lite'||JSON.stringify(x.fallback_models)!==JSON.stringify(e)||x.router!==false)process.exit(1)"
          curl -fsS "$URL/health" > /tmp/health;node -e "const x=require('/tmp/health');if(!x.ok||x.version!=='11.5.0'||!x.db)process.exit(1)"
          good=0;for i in 1 2 3;do code=$(curl -sS -o /tmp/ready -w '%{http_code}' -H "X-SuperAgent-Key: $SETUP_KEY" "$URL/ready?all=1"||true);cat /tmp/ready;if [ "$code" = 200 ]&&node -e "const x=require('/tmp/ready'),e=['gemini::gemini-3.5-flash-lite','gemini::gemini-3.1-flash-lite','gemini::gemini-flash-lite-latest'];process.exit(x.ok&&x.all_models_ok&&JSON.stringify(x.attempts.map(a=>a.model))===JSON.stringify(e)&&x.attempts.every(a=>a.ok)?0:1)";then good=1;break;fi;sleep 10;done;test "$good" = 1
          curl -fsS -H "Authorization: Bearer $SETUP_KEY" "$URL/selftest" > /tmp/selfendpoint
          node -e "const x=require('/tmp/selfendpoint');if(!x.ok||!x.v10.ok||!x.v11.ok||!x.v113.ok||!x.v114.ok||!x.v115.ok)throw Error(JSON.stringify(x))"
      - name: Live Telegram D1 regression
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/live115.mjs <<'NODE'
          import{execFileSync}from'node:child_process';import fs from'node:fs';const U=process.env.URL,D=process.env.DB,C=String(process.env.STAGING_ADMIN_CHAT_ID),S=process.env.WEBHOOK_SECRET,cfg='wrangler.v115.final2.jsonc',sl=m=>new Promise(r=>setTimeout(r,m)),e=s=>String(s).replaceAll("'","''");function q(sql){const o=execFileSync('npx',['wrangler','d1','execute',D,'--remote','--config',cfg,'--command',sql,'--json'],{encoding:'utf8'});return JSON.parse(o)?.[0]?.results||[]}let seq=1980000000+(Date.now()%8000000),mid=980000;const started=new Date().toISOString(),passes=[];async function post(text,id=++seq){const b={update_id:id,message:{message_id:++mid,date:Math.floor(Date.now()/1000),chat:{id:Number(C),type:'private'},from:{id:Number(C),is_bot:false,first_name:'V115'},text}},t=Date.now(),r=await fetch(U+'/telegram',{method:'POST',headers:{'content-type':'application/json','X-Telegram-Bot-Api-Secret-Token':S},body:JSON.stringify(b)});if(!r.ok)throw Error('webhook '+r.status);return{id,t}}async function wait(id){const end=Date.now()+65000;let x;while(Date.now()<end){x=q(`SELECT status,attempts,last_error FROM telegram_inbox_v106 WHERE update_id='${id}' LIMIT 1`)[0];if(x?.status==='done')return x;if(x?.status==='failed')throw Error(x.last_error);await sl(350)}throw Error('timeout '+id)}function ok(n,c,d=''){if(!c)throw Error('FAIL '+n+' '+d);passes.push({name:n,detail:d});console.log('PASS',n,d)}q(`DELETE FROM shopping_sessions WHERE chat_id='${e(C)}';DELETE FROM smart_list_items WHERE chat_id='${e(C)}';DELETE FROM smart_lists WHERE chat_id='${e(C)}';DELETE FROM reminders WHERE chat_id='${e(C)}' AND title LIKE '%V115Z%';`);
          let x=await post('انت اسمك اي'),r=await wait(x.id);ok('identity',r.attempts===1,Date.now()-x.t);x=await post('عامل اي');r=await wait(x.id);ok('casual',r.attempts===1,Date.now()-x.t);x=await post('اشرحلي يعني ايه ذكاء اصطناعي ببساطة');r=await wait(x.id);ok('direct chat',r.attempts===1,Date.now()-x.t);x=await post('سعر الدولار؟');r=await wait(x.id);let last=q(`SELECT content FROM conversation_messages WHERE chat_id='${e(C)}' AND role='assistant' ORDER BY id DESC LIMIT 1`)[0]?.content||'';ok('current safety',/مصدر|مش هخمن|لحظية/.test(last),last.slice(0,150));const list='بص عاوز اشتري\nعيش تورتيلا\nعيش توست\nفينو اسود\nفصوص رومي\nشيدر طبيعي\nكاجو\nفستق\nكوفي شيك\nحليب دينا\nايس كريم دينا\nوبطاطس طبيعية';x=await post(list);r=await wait(x.id);let rows=q(`SELECT title FROM smart_list_items WHERE chat_id='${e(C)}' AND status='pending'`);ok('shopping 11',rows.length===11,rows.length);x=await post('فكرني يوم 28 أكتوبر 2026 الساعة 6:53 مساء أراجع V115Z SINGLE');r=await wait(x.id);rows=q(`SELECT local_date,local_time FROM reminders WHERE chat_id='${e(C)}' AND title='أراجع V115Z SINGLE' AND cancelled=0`);ok('reminder',rows.length===1&&rows[0].local_date==='2026-10-28'&&rows[0].local_time==='18:53',JSON.stringify(rows));const did=++seq,txt='فكرني يوم 29 أكتوبر 2026 الساعة 6:59 مساء أراجع V115Z IDEMP';await Promise.all([post(txt,did),post(txt,did)]);await wait(did);rows=q(`SELECT id FROM reminders WHERE chat_id='${e(C)}' AND title='أراجع V115Z IDEMP' AND cancelled=0`);ok('idempotent',rows.length===1,rows.length);const a=await Promise.all(['/shopping','/today','صباح الفل'].map(v=>post(v))),d=[];for(const z of a)d.push(await wait(z.id));ok('burst',d.every(x=>x.attempts===1),JSON.stringify(d.map(x=>x.attempts)));const f=q(`SELECT scope,error_text FROM runtime_failures WHERE created_at>='${started}' ORDER BY id`);ok('runtime zero',f.length===0,JSON.stringify(f));const ready=JSON.parse(fs.readFileSync('/tmp/ready'));fs.writeFileSync('V11_5_LIVE_REPORT.json',JSON.stringify({ok:true,version:'11.5.0',sha256:process.env.V115_SHA,started,finished:new Date().toISOString(),model_probes:ready.attempts,passes,runtime_failures:f},null,2));
          NODE
          node /tmp/live115.mjs
          printf '%s  SuperAgent_V11_5_FULL.js\n' "$V115_SHA" > V11_5_SHA256.txt
      - name: Commit certified V11.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add SuperAgent_V11_5_FULL.js V11_5_CERTIFICATION.json V11_5_LIVE_REPORT.json V11_5_SHA256.txt;git commit -m 'Build and live-certify SuperAgent V11.5 final hardened release';git push origin HEAD:superagent-v11-5-hardening
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAgent-V11.5-Final2-Live-Certified
          retention-days: 30
          path: |
            SuperAgent_V11_5_FULL.js
            V11_5_CERTIFICATION.json
            V11_5_LIVE_REPORT.json
            V11_5_SHA256.txt
