name: SAND Model Candidate Probe
on:
  push:
    branches: [sand-one-1.0]
    paths:
      - '.github/workflows/sand-model-candidate-probe.yml'
      - 'tools/sand-one-ci/model-candidate-probe-trigger.txt'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OKEY: ${{ secrets.OMNIAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Probe replacement candidates
        run: |
          set -euo pipefail
          mkdir -p tools/sand-one-ci
          node - <<'NODE'
          const fs = require('fs');
          const key = String(process.env.OKEY || '');
          if (!key) throw new Error('missing OKEY');
          const endpoint = 'https://omniai-engine.ahmeddoba91.workers.dev/v1/chat/completions';
          const models = [
            'nvidia::openai/gpt-oss-120b',
            'nvidia::nvidia/nemotron-3-super-120b-a12b',
            'nvidia::z-ai/glm-5.2',
            'nvidia::deepseek-ai/deepseek-v4-flash',
            'nvidia::stepfun-ai/step-3.7-flash',
            'nvidia::mistralai/mistral-large-3-675b-instruct-2512',
            'openrouter::nvidia/nemotron-3-super-120b-a12b:free',
            'openrouter::nvidia/nemotron-3-ultra-550b-a55b:free',
            'openrouter::google/gemma-4-31b-it:free',
            'openrouter::openai/gpt-oss-20b:free',
            'gemini::gemini-3.5-flash',
            'mistral::mistral-small-latest',
          ];
          const rows = [];
          let live = 0;
          for (const model of models) {
            const started = Date.now();
            try {
              const r = await fetch(endpoint, {
                method: 'POST',
                headers: { authorization: `Bearer ${key}`, 'content-type': 'application/json' },
                body: JSON.stringify({ model, messages: [{role:'user',content:'رد بكلمة OK فقط'}], max_tokens: 16, stream: false }),
                signal: AbortSignal.timeout(15000),
              });
              const ms = Date.now() - started;
              if (r.ok) {
                live += 1;
                rows.push(`LIVE\t${r.status}\t${ms}\t${model}`);
                console.log(`CANDIDATE LIVE model=${model} status=${r.status} latency_ms=${ms}`);
              } else {
                const body = (await r.text().catch(()=>'' )).replace(/\s+/g,' ').slice(0,220);
                rows.push(`FAIL\t${r.status}\t${ms}\t${model}\t${body}`);
                console.log(`CANDIDATE FAIL model=${model} status=${r.status} latency_ms=${ms} body=${body}`);
              }
            } catch (e) {
              const ms = Date.now() - started;
              const body = String(e?.message||e).replace(/\s+/g,' ').slice(0,200);
              rows.push(`FAIL\tnetwork\t${ms}\t${model}\t${body}`);
              console.log(`CANDIDATE FAIL model=${model} status=network latency_ms=${ms} body=${body}`);
            }
          }
          fs.writeFileSync('tools/sand-one-ci/model-candidate-probe-result.txt', `tested_at=${new Date().toISOString()}\nlive=${live}/${models.length}\nstatus\thttp\tlatency_ms\tmodel\tdetail\n${rows.join('\n')}\n`);
          console.log(`CANDIDATE_PROBE_COMPLETE live=${live}/${models.length}`);
          NODE
      - name: Publish measured candidate result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/sand-one-ci/model-candidate-probe-result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'SAND Core: record replacement model probe'
          git push origin HEAD:sand-one-1.0
