name: Build SuperAgent V9.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode V9.2 source
        shell: bash
        run: |
          base64 -d SuperAgent_V9.1_Final_Fix.js.gz.b64 > payload.gz
          gzip -dc payload.gz > SuperAgent_V9.2_Final_Stability.js
          rm -f payload.gz

      - name: Verify JavaScript integrity
        shell: bash
        run: |
          node --check SuperAgent_V9.2_Final_Stability.js
          test "$(wc -c < SuperAgent_V9.2_Final_Stability.js)" -eq 225435
          test "$(sha256sum SuperAgent_V9.2_Final_Stability.js | cut -d' ' -f1)" = "0b3fa5c664b1a7969f5aee0fe3de9499f08e62d39dbcb4169d065ac820967ae9"

      - name: Semantic regression smoke tests
        shell: bash
        run: |
          grep -q 'version:"9.2"' SuperAgent_V9.2_Final_Stability.js
          grep -q 'multi_prayer_safe:true' SuperAgent_V9.2_Final_Stability.js
          grep -q 'action_reference_safe:true' SuperAgent_V9.2_Final_Stability.js
          grep -q 'meridiem_inheritance_safe:true' SuperAgent_V9.2_Final_Stability.js
          grep -q 'parseRecurringPrayerAnchors' SuperAgent_V9.2_Final_Stability.js
          grep -q 'buildActionReferenceReminderIntent' SuperAgent_V9.2_Final_Stability.js

      - name: Commit rebuilt V9.2 file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SuperAgent_V9.2_Final_Stability.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build Super Agent V9.2 Final Stability"
          git push
