name: SAND ONE Web Live Gated Apply
on:
  push:
    branches: [sand-one-1.0]
    paths:
      - 'tools/apply-sand-one-web-live.py'
      - 'tools/sand-one-web-live-bootstrap/**'
      - '.github/workflows/sand-one-web-live-gated-apply.yml'
permissions:
  contents: write
concurrency:
  group: sand-one-web-live-gated-apply
  cancel-in-progress: false
jobs:
  gate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      OKEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      CHAT: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      GSEARCH_KEY: ${{ secrets.STAGING_GOOGLE_SEARCH_API_KEY }}
      GSEARCH_CX: ${{ secrets.STAGING_GOOGLE_SEARCH_CX }}
      GMAPS_KEY: ${{ secrets.STAGING_GOOGLE_MAPS_API_KEY }}
      URL: https://sand-one-staging.ahmeddoba91.workers.dev
      DB: sand-one-staging-v1
      CFG: wrangler.sand-one-web-live.jsonc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact Web Live extension
        run: |
          set -euo pipefail
          python tools/apply-sand-one-web-live.py
          test -s SAND_ONE_1.0.js
          grep -q 'const APP_VERSION = "1.0.0-dev.2"' SAND_ONE_1.0.js
          node --check SAND_ONE_1.0.js
          ! grep -q 'text\.includes(' SAND_ONE_1.0.js
          ! grep -Eq '\beval\(' SAND_ONE_1.0.js
          ! grep -q 'Math\.random' SAND_ONE_1.0.js
          ! grep -q '@ts-ignore\|@ts-nocheck' SAND_ONE_1.0.js
          ! grep -q 'AMBIGUOUS' SAND_ONE_1.0.js
          sha256sum SAND_ONE_1.0.js
          wc -l -c SAND_ONE_1.0.js

      - name: checkJs zero diagnostics
        run: |
          set -euo pipefail
          npm install --no-save typescript@5.8.3 wrangler@latest >/dev/null
          printf '%s' '{"compilerOptions":{"allowJs":true,"checkJs":true,"noEmit":true,"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM"],"skipLibCheck":true,"strict":false},"files":["SAND_ONE_1.0.js"]}' > tsconfig.json
          npx tsc -p tsconfig.json --pretty false

      - name: Probe fixed model chain
        run: |
          set -euo pipefail
          test -n "$OKEY"
          node - <<'NODE'
          const key=process.env.OKEY,ep='https://omniai-engine.ahmeddoba91.workers.dev/v1/chat/completions';
          const models=['groq::openai/gpt-oss-120b','groq::qwen/qwen3.6-27b','gemini::gemini-3.5-flash-lite'];
          (async()=>{for(const model of models){const c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);try{const r=await fetch(ep,{method:'POST',headers:{authorization:'Bearer '+key,'content-type':'application/json'},body:JSON.stringify({model,messages:[{role:'user',content:'رد OK فقط'}],max_tokens:32,stream:false}),signal:c.signal});if(!r.ok)throw Error(model+' HTTP '+r.status);console.log(model+' OK '+r.status)}finally{clearTimeout(tm)}}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Provision dedicated SAND ONE staging D1
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=x.find(v=>v.name===process.env.DB);process.stdout.write(r?.uuid||r?.id||"")')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$DB" >/tmp/d1-create.txt
            sleep 2
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID=$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/d1.json","utf8"));const r=x.find(v=>v.name===process.env.DB);process.stdout.write(r?.uuid||r?.id||"")')
          fi
          test -n "$DB_ID"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Deploy isolated SAND ONE staging
        run: |
          set -euo pipefail
          test -n "$BOT"; test -n "$OKEY"; test -n "$CHAT"; test -n "$DB_ID"
          cat > "$CFG" <<JSON
          {"name":"sand-one-staging","main":"SAND_ONE_1.0.js","compatibility_date":"2026-08-20","compatibility_flags":["global_fetch_strictly_public"],"vars":{"PUBLIC_BOT":"false"},"d1_databases":[{"binding":"DB","database_name":"$DB","database_id":"$DB_ID"}],"services":[{"binding":"OMNIAI_SERVICE","service":"omniai-engine"}]}
          JSON
          npx wrangler deploy --config "$CFG" >/dev/null
          W=$(openssl rand -hex 32); K=$(openssl rand -hex 32)
          echo "::add-mask::$W"; echo "::add-mask::$K"
          echo "W=$W" >> "$GITHUB_ENV"; echo "K=$K" >> "$GITHUB_ENV"
          for p in "TELEGRAM_BOT_TOKEN:$BOT" "OMNIAI_API_KEY:$OKEY" "TELEGRAM_WEBHOOK_SECRET:$W" "SETUP_KEY:$K" "ALLOWED_CHAT_ID:$CHAT"; do n=${p%%:*};v=${p#*:};printf '%s' "$v"|npx wrangler secret put "$n" --config "$CFG" >/dev/null;done
          if [ -n "$GSEARCH_KEY" ]; then printf '%s' "$GSEARCH_KEY"|npx wrangler secret put GOOGLE_SEARCH_API_KEY --config "$CFG" >/dev/null; fi
          if [ -n "$GSEARCH_CX" ]; then printf '%s' "$GSEARCH_CX"|npx wrangler secret put GOOGLE_SEARCH_CX --config "$CFG" >/dev/null; fi
          if [ -n "$GMAPS_KEY" ]; then printf '%s' "$GMAPS_KEY"|npx wrangler secret put GOOGLE_MAPS_API_KEY --config "$CFG" >/dev/null; fi

      - name: Health and extension selftest proof
        run: |
          set -euo pipefail
          healthy=0
          for i in {1..50}; do
            code=$(curl -sS -o /tmp/h -w '%{http_code}' "$URL/health" || true)
            if [ "$code" = 200 ] && node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/h'));
          const f=Object.fromEntries((x.capability_families||[]).map(v=>[v.id,v.state]));
          process.exit(x.ok&&x.version==='1.0.0-dev.2'&&x.semantic_routing===true&&x.keyword_routing===false&&x.voice_input===true&&(x.capability_families||[]).length===12&&f.shopping==='active'&&f.work==='active'&&f.web_live==='active'?0:1);
          NODE
            then healthy=1; break; fi
            sleep 2
          done
          [ "$healthy" = 1 ] || { cat /tmp/h >&2; exit 1; }
          admin_ok=0
          for i in {1..40}; do
            ac=$(curl -sS -o /tmp/a -w '%{http_code}' -H "x-sand-admin: $K" "$URL/admin/selftest" || true)
            if [ "$ac" = 200 ] && node - <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/a'));
          const names=new Set((x.tests||[]).filter(t=>t.ok).map(t=>t.name));
          process.exit(x.ok&&x.tests?.every(t=>t.ok)&&names.has('web_live:contract')&&names.has('web_live:ssrf_guard')&&names.has('web_live:circuit_breaker')?0:1);
          NODE
            then admin_ok=1; break; fi
            sleep 2
          done
          [ "$admin_ok" = 1 ] || { cat /tmp/a >&2; exit 1; }
          cat /tmp/h
          cat /tmp/a

      - name: Core V2 semantic regression gate
        run: |
          set +e
          node sand_v2/live_gate.mjs
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '===== SAND ONE CORE REGRESSION DIAGNOSTICS ====='
            npx wrangler d1 execute "$DB" --remote --config "$CFG" --command "SELECT source_update_id,status,error,plan_json,result_json FROM sand_v2_operations ORDER BY created_at DESC LIMIT 12;" || true
            npx wrangler d1 execute "$DB" --remote --config "$CFG" --command "SELECT update_id,phase,model_id,model_role,ok,http_status,error_code,created_at FROM sand_v2_ai_calls ORDER BY id DESC LIMIT 18;" || true
            exit "$rc"
          fi

      - name: Public live adapter smoke
        run: |
          set -euo pipefail
          node - <<'NODE'
          async function get(url){for(let i=0;i<3;i++){try{const r=await fetch(url,{signal:AbortSignal.timeout(10000)});if(r.ok)return r}catch{} await new Promise(r=>setTimeout(r,1000));}throw Error('live adapter smoke failed '+url)}
          (async()=>{
            const w=await (await get('https://api.open-meteo.com/v1/forecast?latitude=30.0444&longitude=31.2357&current=temperature_2m&timezone=auto')).json(); if(typeof w?.current?.temperature_2m!=='number')throw Error('weather payload invalid');
            const n=await (await get('https://api.gdeltproject.org/api/v2/doc/doc?query=Egypt&mode=ArtList&maxrecords=3&format=json&sort=HybridRel')).json(); if(!Array.isArray(n?.articles))throw Error('news payload invalid');
            const page=await get('https://example.com/'); const text=await page.text(); if(!text.includes('Example Domain'))throw Error('web reader smoke invalid');
            console.log('PUBLIC_WEB_LIVE_SMOKE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Optional Google live proof
        run: |
          set -euo pipefail
          if [ -n "$GSEARCH_KEY" ] && [ -n "$GSEARCH_CX" ]; then
            node - <<'NODE'
          const p=new URLSearchParams({key:process.env.GSEARCH_KEY,cx:process.env.GSEARCH_CX,q:'OpenAI',num:'1',safe:'active'});
          fetch('https://www.googleapis.com/customsearch/v1?'+p,{signal:AbortSignal.timeout(12000)}).then(async r=>{if(!r.ok)throw Error('Google Search HTTP '+r.status);const x=await r.json();if(!Array.isArray(x.items))throw Error('Google Search payload invalid');console.log('GOOGLE_SEARCH_LIVE_OK')}).catch(e=>{console.error(e);process.exit(1)});
          NODE
          else
            echo 'GOOGLE_SEARCH_LIVE_SKIPPED_NO_STAGING_SECRET'
          fi
          if [ -n "$GMAPS_KEY" ]; then
            node - <<'NODE'
          fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',headers:{'content-type':'application/json','X-Goog-Api-Key':process.env.GMAPS_KEY,'X-Goog-FieldMask':'places.id,places.displayName'},body:JSON.stringify({textQuery:'Cairo Tower',maxResultCount:1,languageCode:'en'}),signal:AbortSignal.timeout(12000)}).then(async r=>{if(!r.ok)throw Error('Google Places HTTP '+r.status);const x=await r.json();if(!Array.isArray(x.places))throw Error('Google Places payload invalid');console.log('GOOGLE_PLACES_LIVE_OK')}).catch(e=>{console.error(e);process.exit(1)});
          NODE
          else
            echo 'GOOGLE_PLACES_LIVE_SKIPPED_NO_STAGING_SECRET'
          fi

      - name: Commit only gated source
        run: |
          set -euo pipefail
          git config user.name 'SAND ONE Gate'
          git config user.email 'actions@users.noreply.github.com'
          rm -f tools/apply-sand-one-web-live.py .github/workflows/sand-one-web-live-gated-apply.yml
          rm -rf tools/sand-one-web-live-bootstrap
          git add -- SAND_ONE_1.0.js sand_one/source/part00.js.txt sand_one/source/part05_01.js.txt sand_one/source/part07_01.js.txt sand_one/source/part08_00.js.txt sand_one/source/part08_01.js.txt
          git add -u -- tools/apply-sand-one-web-live.py tools/sand-one-web-live-bootstrap .github/workflows/sand-one-web-live-gated-apply.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'SAND ONE: activate Web and Live capability family'
          git push origin HEAD:sand-one-1.0
