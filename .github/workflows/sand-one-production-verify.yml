name: SAND ONE Production Verify

on:
  push:
    branches: [sand-one-1.0]
    paths:
      - '.github/workflows/sand-one-production-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PROD_URL: https://superagent.ahmeddoba91.workers.dev
      EXPECTED_VERSION: 1.0.0-dev.6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0
          fetch-depth: 0

      - name: Poll production health
        id: check
        shell: bash
        run: |
          set +e
          ok=false
          body=''
          code=''
          for i in {1..60}; do
            code=$(curl -sS -o /tmp/health -w '%{http_code}' "$PROD_URL/health" || true)
            body=$(cat /tmp/health 2>/dev/null || true)
            if [ "$code" = 200 ] && node - <<'NODE'
          const fs=require('fs');
          try {
            const x=JSON.parse(fs.readFileSync('/tmp/health','utf8'));
            process.exit(x.ok===true && x.version===process.env.EXPECTED_VERSION && x.semantic_routing===true && x.keyword_routing===false ? 0 : 1);
          } catch { process.exit(1); }
          NODE
            then ok=true; break; fi
            sleep 2
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/health ]; then cp /tmp/health /tmp/health-final; else printf '{}' >/tmp/health-final; fi
          exit 0

      - name: Write verification marker
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          let health={}; try{health=JSON.parse(fs.readFileSync('/tmp/health-final','utf8'))}catch{}
          const out={
            checked_at:new Date().toISOString(),
            deployed:process.env.CHECK_OK==='true',
            http_code:Number(process.env.HTTP_CODE||0),
            expected_version:process.env.EXPECTED_VERSION,
            observed_version:health.version||null,
            service:health.service||null,
            semantic_routing:health.semantic_routing??null,
            keyword_routing:health.keyword_routing??null
          };
          fs.mkdirSync('tools',{recursive:true});
          fs.writeFileSync('tools/sand-one-production-status.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name 'SAND ONE Production Verify'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/sand-one-production-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SAND ONE: record production verification"
          git push origin HEAD:sand-one-1.0
        env:
          CHECK_OK: ${{ steps.check.outputs.ok }}
          HTTP_CODE: ${{ steps.check.outputs.http_code }}
