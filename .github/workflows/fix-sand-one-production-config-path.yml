name: Fix SAND ONE Production Config Path
on:
  push:
    branches: [sand-one-1.0]
    paths:
      - '.github/workflows/fix-sand-one-production-config-path.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0
          fetch-depth: 0
      - name: Patch only Wrangler config location
        run: |
          set -euo pipefail
          f=.github/workflows/sand-one-production-deploy.yml
          grep -Fq '/tmp/wrangler.production.jsonc' "$f"
          sed -i 's#/tmp/wrangler\.production\.jsonc#wrangler.production.jsonc#g' "$f"
          grep -Fq "fs.writeFileSync('wrangler.production.jsonc'" "$f"
          grep -Fq -- '--config wrangler.production.jsonc' "$f"
          git diff --check
          git config user.name 'SAND ONE Production Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add "$f"
          git commit -m 'SAND ONE: resolve production Wrangler config from repo root'
          git push origin HEAD:sand-one-1.0
