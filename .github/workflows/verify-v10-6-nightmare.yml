name: Verify SuperAgent V10.6 Nightmare Matrix

on:
  push:
    branches: [superagent-v10-6-zero-known-failures]
    paths:
      - 'tools/build-v10-6.py'
      - '.github/workflows/verify-v10-6-nightmare.yml'
      - 'tests/v10-6-*.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v10-6-nightmare
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Build V10.6 and syntax
        run: |
          python tools/build-v10-6.py
          node --check SuperAgent_V10_6_Zero_Known_Failures.js
          node tests/v10-3-intellisense-regression.mjs SuperAgent_V10_6_Zero_Known_Failures.js

      - name: Manual production findings
        run: |
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_5_Reliability_Rewrite.js
          python tools/patch-v10-5-regression-harness.py
          node tests/v10-5-manual-bugs-regression.mjs
          node tests/v10-5-human-findings-regression.mjs

      - name: Prepare stress compatibility harness
        run: |
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_4_Zero_Known_Bugs.js
          python tools/patch-v10-4-1-stress-chat-id.py
          python -c "from pathlib import Path; p=Path('tests/v10-4-1-ultra-direct-stress.mjs'); s=p.read_text(); old=\"VALUES (?,'reminder',?,'reminder',?,?,?,?,1,?,?)\"; new=\"VALUES (?,'reminder',?,'reminder',?,?,?,1,?,?)\"; s=s.replace(old,new,1) if old in s else s; p.write_text(s)"
          python tools/patch-v10-4-1-stress-ready-users.py

      - name: Ultra deterministic fuzz 4644 x3
        run: |
          for i in 1 2 3; do node tests/v10-4-1-ultra-direct-stress.mjs; done

      - name: Boundary dependency concurrency 5112 x3
        run: |
          for i in 1 2 3; do node tests/v10-4-1-boundary-concurrency.mjs; done

      - name: Killer regression x30
        run: |
          for i in $(seq 1 30); do node tests/v10-4-killer-regression.mjs; done

      - name: Data controls and Arabic UI
        run: |
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_4_2_Data_Controls.js
          node tests/v10-4-2-data-controls-e2e.mjs
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_4_3_Full_Arabic.js
          node tests/v10-4-3-arabic-ui-e2e.mjs
          python tools/verify-v10-4-3-arabic.py SuperAgent_V10_4_3_Full_Arabic.js

      - name: Atomic shopping and dependency graph
        run: |
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_3_4_Atomic_Direct.js
          node tests/v10-3-4-atomic-direct-e2e.mjs
          node tests/v10-3-4-natural-shopping-v2.mjs
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_3_3_Chain_Final.js
          for i in $(seq 1 20); do node tests/v10-3-3-chain-e2e.mjs; done
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_3_2_Dependency_Canonical.js
          for i in $(seq 1 50); do node tests/v10-3-2-cycle-regression.mjs; done

      - name: Reliability failure injection x30
        run: |
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_3_Reliability_Lock.js
          for i in $(seq 1 30); do node tests/v10-3-reliability.mjs; done
          node tests/v10-2-semantic-ci.mjs SuperAgent_V10_3_Reliability_Lock.js
          node tests/stress-v9-2.cjs SuperAgent_V10_3_Reliability_Lock.js

      - name: Full V10 stress E2E migration diagnostics
        run: |
          cp SuperAgent_V10_Final_Stability.js .v101_backup.js
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_Final_Stability.js
          node tests/v10-final-stress.mjs
          node tests/v10-final-e2e.mjs
          node tests/v10-final-migration.mjs
          mv .v101_backup.js SuperAgent_V10_Final_Stability.js
          cp SuperAgent_V10_6_Zero_Known_Failures.js SuperAgent_V10_3_Reliability_Lock.js
          node tests/v10-3-1-diagnostics.mjs

      - name: V10.6 static durability assertions
        run: |
          grep -q 'telegram_inbox_v106' SuperAgent_V10_6_Zero_Known_Failures.js
          grep -q 'telegram_chat_leases_v106' SuperAgent_V10_6_Zero_Known_Failures.js
          grep -q 'persistTelegramInboxV106' SuperAgent_V10_6_Zero_Known_Failures.js
          grep -q 'drainPendingTelegramInboxV106' SuperAgent_V10_6_Zero_Known_Failures.js
          grep -q 'v106_cross_isolate_serialization:true' SuperAgent_V10_6_Zero_Known_Failures.js

      - name: Final V10.6 report
        run: |
          BYTES=$(wc -c < SuperAgent_V10_6_Zero_Known_Failures.js)
          SHA=$(sha256sum SuperAgent_V10_6_Zero_Known_Failures.js | cut -d' ' -f1)
          cat > V10_6_NIGHTMARE_REPORT.txt <<REPORT
          سوبر إيجنت V10.6 — Nightmare Verification
          Syntax + IntelliSense: PASS
          Manual production findings: PASS
          Ultra fuzz: 13,932 assertions PASS
          Boundary/dependency/concurrency: 15,336 assertions PASS
          Killer regression x30: PASS
          Data controls + Arabic UI: PASS
          Atomic shopping: PASS
          Dependency chain x20 + cycles x50: PASS
          Reliability failure injection x30: PASS
          Semantic + V9 stress: PASS
          Full V10 stress/E2E/migration/diagnostics: PASS
          Durable D1 Telegram inbox assertions: PASS
          Known failures in deterministic matrix: 0
          Exact bytes: $BYTES
          Exact SHA256: $SHA
          VERIFIED_FOR_LIVE_STAGING
          REPORT

      - name: Restore compatibility files before commit
        run: |
          git checkout -- SuperAgent_V10_5_Reliability_Rewrite.js SuperAgent_V10_4_Zero_Known_Bugs.js SuperAgent_V10_4_2_Data_Controls.js SuperAgent_V10_4_3_Full_Arabic.js SuperAgent_V10_3_4_Atomic_Direct.js SuperAgent_V10_3_3_Chain_Final.js SuperAgent_V10_3_2_Dependency_Canonical.js SuperAgent_V10_3_Reliability_Lock.js SuperAgent_V10_Final_Stability.js tests/v10-4-1-ultra-direct-stress.mjs tests/v10-4-1-debug-stress-first-case.mjs tests/v10-5-manual-bugs-regression.mjs || true

      - name: Commit verified V10.6 build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SuperAgent_V10_6_Zero_Known_Failures.js V10_6_NIGHTMARE_REPORT.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build and verify Super Agent V10.6 nightmare matrix'
          git push
