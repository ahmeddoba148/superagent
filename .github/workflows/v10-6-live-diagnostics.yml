name: V10.6 Live Queue Diagnostics

on:
  push:
    branches: [superagent-v10-6-zero-known-failures]
    paths:
      - '.github/workflows/v10-6-live-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save wrangler@latest
      - name: Build D1 config
        run: node -e 'const fs=require("fs");let s=fs.readFileSync("wrangler.v10-6-staging.template.jsonc","utf8").replace("__D1_DATABASE_ID__","65df37bc-973d-4bfe-a3f4-7c049e570697");fs.writeFileSync("wrangler.v106.staging.jsonc",s)'
      - name: Dump V10.6 queue, residual schedule and audit state
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute superagent-v106-staging --remote --json --config wrangler.v106.staging.jsonc --command "SELECT status,COUNT(*) c,MIN(attempts) min_attempts,MAX(attempts) max_attempts FROM telegram_inbox_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID' GROUP BY status; SELECT update_id,status,attempts,lease_until,last_error,created_at,updated_at FROM telegram_inbox_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY CAST(update_id AS INTEGER) DESC LIMIT 80; SELECT * FROM telegram_chat_leases_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID'; SELECT status,COUNT(*) c FROM telegram_updates WHERE chat_id='$STAGING_ADMIN_CHAT_ID' GROUP BY status; SELECT update_id,status,error_text,started_at,finished_at FROM telegram_updates WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY CAST(update_id AS INTEGER) DESC LIMIT 80; SELECT id,title,kind,local_date,local_time,sent,cancelled,created_at,updated_at,duration_minutes FROM reminders WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY id; SELECT id,title,kind,start_at,end_at,max_occurrences,active,created_at,updated_at FROM schedule_rules WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY id; SELECT id,title,prayer,active,created_at FROM prayer_rules WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY id; SELECT id,action_type,entity_type,entity_id,before_json,after_json,created_at FROM action_audit WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY id DESC LIMIT 50; SELECT id,operation_key,operation_type,status,result_json,error_text,created_at FROM operation_receipts WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY id DESC LIMIT 50; SELECT id,scope,error_text,context_json,created_at FROM runtime_failures WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY id DESC LIMIT 50;"
