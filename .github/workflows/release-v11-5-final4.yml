name: Final4 SuperAgent V11.5 Certification
on:
  push:
    branches: [superagent-v11-5-hardening]
    paths: ['.github/workflows/release-v11-5-final4.yml']
permissions:
  contents: write
jobs:
  final4-v115:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      STAGING_OMNIAI_API_KEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      URL: https://superagent-v115-staging.ahmeddoba91.workers.dev
      DB: superagent-v106-staging
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}

      - name: Build and exhaustive static regression gates
        shell: bash
        run: |
          set -euo pipefail
          node tools/build_v11_5.mjs SuperAgent_V11_4_FULL.js SuperAgent_V11_5_FULL.js
          node --check SuperAgent_V11_5_FULL.js
          cp SuperAgent_V11_5_FULL.js /tmp/v115-load.mjs
          node -e "import('/tmp/v115-load.mjs').then(()=>console.log('module-load PASS'))"
          V115_SHA="$(sha256sum SuperAgent_V11_5_FULL.js|awk '{print $1}')"; echo "V115_SHA=$V115_SHA" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('fs');
          const b=fs.readFileSync('SuperAgent_V11_4_FULL.js','utf8'),o=fs.readFileSync('SuperAgent_V11_5_FULL.js','utf8');
          const funcs=s=>new Set([...s.matchAll(/(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(x=>x[1]));
          const tabs=s=>new Set([...s.matchAll(/CREATE TABLE IF NOT EXISTS\s+([A-Za-z0-9_]+)/gi)].map(x=>x[1]));
          const bf=funcs(b),of=funcs(o),bt=tabs(b),ot=tabs(o),mf=[...bf].filter(x=>!of.has(x)),mt=[...bt].filter(x=>!ot.has(x));
          const m=o.match(/const MODEL_CHAIN=\[([\s\S]*?)\n\];\nconst PRIMARY_MODEL/),ids=[...m[1].matchAll(/id:"([^"]+)"/g)].map(x=>x[1]);
          const exp=['gemini::gemini-3.5-flash-lite','gemini::gemini-3.1-flash-lite','gemini::gemini-flash-lite-latest'];
          const checks={models:JSON.stringify(ids)===JSON.stringify(exp),budget:o.includes('const TOTAL_AI_BUDGET_MS=10000;'),routerRemoved:o.includes('v11_semantic_router:false'),noQuerySecrets:!o.includes('searchParams.get("key")')&&!o.includes("searchParams.get('key')"),headerAuth:o.includes('X-SuperAgent-Key')&&o.includes('Authorization'),queueHeartbeat:o.includes('V115_QUEUE_HEARTBEAT_MS=8000')&&o.includes('renewInboxLeaseV115'),voiceDeadline:o.includes('V115_VOICE_TOTAL_BUDGET_MS=20000')&&o.includes('fetchBlobWithTimeoutV115'),currentGate:o.includes('مين رئيس مصر؟')&&o.includes('سعر الدولار؟')&&o.includes('مين CEO جوجل؟'),personalGate:o.includes('needsPersonalizationContextV115'),transportPurge:o.includes('purgeTransportForChatV115'),worldNonMutation:o.includes("if(!mutating.has(action)&&Array.isArray(intent?.world_updates)"),schemaFast:o.includes('schema_version_v115')&&o.includes('ensureRuntimeSchemaReadyV115'),continuationTimeout:o.includes('V115_CONTINUATION_TIMEOUT_MS=1800'),briefWindow:o.includes("clockInWindowV115(now.time,'08:00','08:09')")&&o.includes("clockInWindowV115(now.time,'21:00','21:09')"),branding:o.includes('أنا سوبر إيجنت V11.5')&&o.includes('أنت SuperAgent V11.5'),chatFailureIncident:o.includes('v115_direct_chat_all_models_failed'),holidaySafe:o.includes('if(!successful){const stale=await cacheGetAnyV113'),accurateTimeout:o.includes('Timeout بعد ${attemptMs}ms'),directOnce:(o.match(/if\(await handleDirectCommands\(env,chatId,text\)\)return;/g)||[]).length===1,noMissingFunctions:!mf.length,noMissingTables:!mt.length};
          const failed=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);if(failed.length)throw Error(JSON.stringify({failed,ids,mf,mt},null,2));
          const c=JSON.parse(fs.readFileSync('V11_5_CERTIFICATION.json','utf8'));Object.assign(c,{base_v114_functions:bf.size,retained_v114_functions:[...bf].filter(x=>of.has(x)).length,total_v115_functions:of.size,missing_functions:mf,base_v114_tables:bt.size,retained_v114_tables:[...bt].filter(x=>ot.has(x)).length,total_v115_tables:ot.size,missing_tables:mt,checks,failed_checks:failed});fs.writeFileSync('V11_5_CERTIFICATION.json',JSON.stringify(c,null,2));
          console.log(JSON.stringify({checks,baseFunctions:bf.size,v115Functions:of.size,baseTables:bt.size,v115Tables:ot.size}));
          NODE
          cp SuperAgent_V11_5_FULL.js /tmp/self.mjs
          printf '\nconsole.log(JSON.stringify({v10:runV10SelfTests(),v11:runV11PureSelfTests(),v113:runV113PureSelfTests(),v114:runV114PureSelfTests(),v115:runV115PureSelfTests()}));\n' >> /tmp/self.mjs
          node /tmp/self.mjs | tail -1 > /tmp/self.json
          node - <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/self.json','utf8'));
          if(!x.v10?.ok)throw Error('v10 failed');
          if(!Array.isArray(x.v11)||!x.v11.length||!x.v11.every(t=>t.ok))throw Error('v11 failed '+JSON.stringify(x.v11));
          for(const k of ['v113','v114','v115'])if(!x[k]?.ok)throw Error(k+' failed '+JSON.stringify(x[k]));
          console.log(`pure suites PASS: v10=${x.v10.passed}/${x.v10.total}, v11=${x.v11.length}/${x.v11.length}, v113=${x.v113.passed}/${x.v113.total}, v114=${x.v114.passed}/${x.v114.total}, v115=${x.v115.passed}/${x.v115.total}`);
          NODE

      - name: Deploy exact isolated V11.5 staging
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save wrangler@latest >/dev/null
          cat > wrangler.v115.final4.jsonc <<'EOF'
          {"name":"superagent-v115-staging","main":"SuperAgent_V11_5_FULL.js","compatibility_date":"2026-08-17","vars":{"PUBLIC_BOT":"false","V115_STAGING_BUILD":"final4-live-cert"},"d1_databases":[{"binding":"DB","database_name":"superagent-v106-staging","database_id":"65df37bc-973d-4bfe-a3f4-7c049e570697"}],"services":[{"binding":"OMNIAI_SERVICE","service":"omniai-engine"}]}
          EOF
          npx wrangler deploy --config wrangler.v115.final4.jsonc >/dev/null
          WEBHOOK_SECRET="$(openssl rand -hex 32)";SETUP_KEY="$(openssl rand -hex 32)";echo "::add-mask::$WEBHOOK_SECRET";echo "::add-mask::$SETUP_KEY";echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV";echo "SETUP_KEY=$SETUP_KEY" >> "$GITHUB_ENV"
          for pair in "TELEGRAM_BOT_TOKEN:$STAGING_TELEGRAM_BOT_TOKEN" "OMNIAI_API_KEY:$STAGING_OMNIAI_API_KEY" "ADMIN_CHAT_ID:$STAGING_ADMIN_CHAT_ID" "ALLOWED_CHAT_IDS:$STAGING_ADMIN_CHAT_ID" "TELEGRAM_WEBHOOK_SECRET:$WEBHOOK_SECRET" "SETUP_KEY:$SETUP_KEY";do k="${pair%%:*}";v="${pair#*:}";printf '%s' "$v"|npx wrangler secret put "$k" --config wrangler.v115.final4.jsonc >/dev/null;done
          sleep 6

      - name: Live security schema health and all Gemini probes
        shell: bash
        run: |
          set -euo pipefail
          parse='const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));'
          test "$(curl -sS -o /tmp/query-key.json -w '%{http_code}' "$URL/ready?key=$SETUP_KEY")" = 401
          good=0;for i in 1 2 3 4 5 6;do code=$(curl -sS -o /tmp/setup.json -w '%{http_code}' -X POST -H "X-SuperAgent-Key: $SETUP_KEY" "$URL/setup?force=1"||true);if [ "$code" = 200 ];then good=1;break;fi;echo "setup HTTP $code attempt $i";sleep 3;done;test "$good" = 1
          node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync("/tmp/setup.json","utf8")),e=["gemini::gemini-3.1-flash-lite","gemini::gemini-flash-lite-latest"];if(!x.ok||x.message!=="سوبر إيجنت V11.5 جاهز للعمل"||x.models_total!==3||x.primary_model!=="gemini::gemini-3.5-flash-lite"||JSON.stringify(x.fallback_models)!==JSON.stringify(e)||x.router!==false)throw Error(JSON.stringify(x))'
          curl -fsS "$URL/health" > /tmp/health.json
          node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(!x.ok||x.version!=="11.5.0"||!x.db||!x.omniai_service)throw Error(JSON.stringify(x))'
          good=0;for i in 1 2 3;do code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' -H "X-SuperAgent-Key: $SETUP_KEY" "$URL/ready?all=1"||true);cat /tmp/ready.json;if [ "$code" = 200 ]&&node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync("/tmp/ready.json","utf8")),e=["gemini::gemini-3.5-flash-lite","gemini::gemini-3.1-flash-lite","gemini::gemini-flash-lite-latest"];process.exit(x.ok&&x.all_models_ok&&JSON.stringify(x.attempts.map(a=>a.model))===JSON.stringify(e)&&x.attempts.every(a=>a.ok)?0:1)';then good=1;break;fi;echo "readiness attempt $i failed";sleep 10;done;test "$good" = 1
          curl -fsS -H "Authorization: Bearer $SETUP_KEY" "$URL/selftest" > /tmp/selfendpoint.json
          node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync("/tmp/selfendpoint.json","utf8"));if(!x.ok||x.version!=="11.5.0"||!x.v10?.ok||!x.v11?.ok||!x.v113?.ok||!x.v114?.ok||!x.v115?.ok)throw Error(JSON.stringify(x))'
          npx wrangler d1 execute "$DB" --remote --config wrangler.v115.final4.jsonc --command "SELECT value FROM scheduler_state WHERE key='schema_version_v115'" --json > /tmp/schema.json
          node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync("/tmp/schema.json","utf8"));if(x?.[0]?.results?.[0]?.value!=="11.5.0")throw Error(JSON.stringify(x))'

      - name: Real Telegram and remote D1 regression
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/live115.mjs <<'NODE'
          import{execFileSync}from'node:child_process';import fs from'node:fs';
          const U=process.env.URL,D=process.env.DB,C=String(process.env.STAGING_ADMIN_CHAT_ID),S=process.env.WEBHOOK_SECRET,cfg='wrangler.v115.final4.jsonc',sl=m=>new Promise(r=>setTimeout(r,m)),e=s=>String(s).replaceAll("'","''");
          function q(sql){const o=execFileSync('npx',['wrangler','d1','execute',D,'--remote','--config',cfg,'--command',sql,'--json'],{encoding:'utf8'});return JSON.parse(o)?.[0]?.results||[]}
          let seq=2000000000+(Date.now()%6000000),mid=1000000;const started=new Date().toISOString(),passes=[];
          async function post(text,id=++seq){const b={update_id:id,message:{message_id:++mid,date:Math.floor(Date.now()/1000),chat:{id:Number(C),type:'private'},from:{id:Number(C),is_bot:false,first_name:'V115Final4'},text}},t=Date.now(),r=await fetch(U+'/telegram',{method:'POST',headers:{'content-type':'application/json','X-Telegram-Bot-Api-Secret-Token':S},body:JSON.stringify(b)});if(!r.ok)throw Error('webhook '+r.status);return{id,t}}
          async function wait(id,max=65000){const end=Date.now()+max;let x;while(Date.now()<end){x=q(`SELECT status,attempts,last_error FROM telegram_inbox_v106 WHERE update_id='${id}' LIMIT 1`)[0];if(x?.status==='done')return x;if(x?.status==='failed')throw Error('failed '+id+' '+x.last_error);await sl(350)}throw Error('timeout '+id+' '+JSON.stringify(x))}
          function ok(n,c,d=''){if(!c)throw Error('FAIL '+n+' '+d);passes.push({name:n,detail:String(d)});console.log('PASS',n,d)}
          q(`DELETE FROM shopping_sessions WHERE chat_id='${e(C)}';DELETE FROM smart_list_items WHERE chat_id='${e(C)}';DELETE FROM smart_lists WHERE chat_id='${e(C)}';DELETE FROM reminders WHERE chat_id='${e(C)}' AND title LIKE '%V115FINAL%';`);
          let x=await post('انت اسمك اي'),r=await wait(x.id);ok('identity',r.attempts===1,`ms=${Date.now()-x.t}`);
          x=await post('عامل اي');r=await wait(x.id);ok('egyptian casual',r.attempts===1,`ms=${Date.now()-x.t}`);
          x=await post('اشرحلي يعني ايه ذكاء اصطناعي ببساطة');r=await wait(x.id);ok('direct AI chat',r.attempts===1,`ms=${Date.now()-x.t}`);
          x=await post('سعر الدولار؟');r=await wait(x.id);let last=q(`SELECT content FROM conversation_messages WHERE chat_id='${e(C)}' AND role='assistant' ORDER BY id DESC LIMIT 1`)[0]?.content||'';ok('current-data safe',/مصدر|مش هخمن|لحظية/.test(last),last.slice(0,160));
          const list='بص عاوز اشتري\nعيش تورتيلا\nعيش توست\nفينو اسود\nفصوص رومي\nشيدر طبيعي\nكاجو\nفستق\nكوفي شيك\nحليب دينا\nايس كريم دينا\nوبطاطس طبيعية';x=await post(list);r=await wait(x.id);let rows=q(`SELECT title FROM smart_list_items WHERE chat_id='${e(C)}' AND status='pending'`);ok('shopping 11/11',rows.length===11,`items=${rows.length} ms=${Date.now()-x.t}`);
          x=await post('فكرني يوم 1 نوفمبر 2026 الساعة 7:13 مساء أراجع V115FINAL SINGLE');r=await wait(x.id);rows=q(`SELECT local_date,local_time FROM reminders WHERE chat_id='${e(C)}' AND title='أراجع V115FINAL SINGLE' AND cancelled=0`);ok('reminder exact',rows.length===1&&rows[0].local_date==='2026-11-01'&&rows[0].local_time==='19:13',JSON.stringify(rows));
          const did=++seq,txt='فكرني يوم 2 نوفمبر 2026 الساعة 7:19 مساء أراجع V115FINAL IDEMP';const t=Date.now();await Promise.all([post(txt,did),post(txt,did)]);await wait(did);rows=q(`SELECT id FROM reminders WHERE chat_id='${e(C)}' AND title='أراجع V115FINAL IDEMP' AND cancelled=0`);ok('duplicate exactly once',rows.length===1,`rows=${rows.length} ms=${Date.now()-t}`);
          const a=await Promise.all(['/shopping','/today','صباح الفل'].map(v=>post(v))),d=[];for(const z of a)d.push(await wait(z.id));ok('same-chat burst',d.every(x=>x.attempts===1),JSON.stringify(d.map(x=>x.attempts)));
          const f=q(`SELECT scope,error_text FROM runtime_failures WHERE created_at>='${started}' ORDER BY id`);ok('runtime failures zero',f.length===0,JSON.stringify(f));
          const ready=JSON.parse(fs.readFileSync('/tmp/ready.json','utf8'));fs.writeFileSync('V11_5_LIVE_REPORT.json',JSON.stringify({ok:true,version:'11.5.0',sha256:process.env.V115_SHA,started,finished:new Date().toISOString(),model_probes:ready.attempts,passes,runtime_failures:f},null,2));
          NODE
          node /tmp/live115.mjs
          printf '%s  SuperAgent_V11_5_FULL.js\n' "$V115_SHA" > V11_5_SHA256.txt

      - name: Commit certified final V11.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SuperAgent_V11_5_FULL.js V11_5_CERTIFICATION.json V11_5_LIVE_REPORT.json V11_5_SHA256.txt
          git commit -m 'Build and live-certify final SuperAgent V11.5 hardened release'
          git push origin HEAD:superagent-v11-5-hardening
      - uses: actions/upload-artifact@v4
        with:
          name: SuperAgent-V11.5-Final-Live-Certified
          retention-days: 30
          path: |
            SuperAgent_V11_5_FULL.js
            V11_5_CERTIFICATION.json
            V11_5_LIVE_REPORT.json
            V11_5_SHA256.txt
