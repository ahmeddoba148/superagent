name: SAND ONE Certified Root Sync

on:
  workflow_run:
    workflows: ["SAND ONE Capability Live Gate"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: sand-one-certified-root-sync
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'sand-one-1.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0
          fetch-depth: 0
      - name: Assemble exact certified runtime source
        run: |
          set -euo pipefail
          count=$(find sand_one/runtime -maxdepth 1 -type f -name 'part*.js.txt' | wc -l | tr -d ' ')
          [ "$count" = "25" ]
          cat sand_one/runtime/part*.js.txt > /tmp/SAND_ONE_1.0.js
          grep -q 'const APP_VERSION = "1.0.0-dev.4"' /tmp/SAND_ONE_1.0.js
          node --check /tmp/SAND_ONE_1.0.js
          sha256sum /tmp/SAND_ONE_1.0.js
          cp /tmp/SAND_ONE_1.0.js SAND_ONE_1.0.js
      - name: Commit only when root differs
        run: |
          set -euo pipefail
          if git diff --quiet -- SAND_ONE_1.0.js; then
            echo 'ROOT_ALREADY_CERTIFIED'
            exit 0
          fi
          git config user.name 'SAND ONE Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- SAND_ONE_1.0.js
          git diff --cached --check
          git commit -m 'SAND ONE: sync certified dev4 runtime root'
          git push origin HEAD:sand-one-1.0
