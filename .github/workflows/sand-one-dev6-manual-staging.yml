# retrigger: 2026-08-20T23:58Z
name: SAND ONE dev6 Manual Staging
on:
  push:
    branches: [sand-one-1.0]
    paths:
      - '.github/workflows/sand-one-dev6-manual-staging.yml'
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      CHAT: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      URL: https://sand-one-dev6-staging.ahmeddoba91.workers.dev
      DB_ID: c194eb5c-87d7-4673-a1c0-b991258b834b
      CFG: wrangler.sand-one-dev6-manual.jsonc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Point staging Telegram bot to dev6 staging
        run: |
          set -euo pipefail
          npm install --no-save wrangler@latest >/dev/null
          test -n "$BOT"; test -n "$CHAT"; test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cat > "$CFG" <<JSON
          {"name":"sand-one-dev6-staging","main":"SAND_ONE_1.0.js","compatibility_date":"2026-08-20","compatibility_flags":["global_fetch_strictly_public"],"vars":{"PUBLIC_BOT":"false"},"d1_databases":[{"binding":"DB","database_name":"sand-one-dev6-staging-v1","database_id":"$DB_ID"}],"services":[{"binding":"OMNIAI_SERVICE","service":"omniai-engine"}]}
          JSON
          W=$(openssl rand -hex 32); K=$(openssl rand -hex 32)
          echo "::add-mask::$W"; echo "::add-mask::$K"
          printf '%s' "$W" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config "$CFG" >/dev/null
          printf '%s' "$K" | npx wrangler secret put SETUP_KEY --config "$CFG" >/dev/null
          sleep 3
          code=$(curl -sS -o /tmp/setup -w '%{http_code}' -H "X-Sand-Key: $K" "$URL/setup")
          [ "$code" = 200 ]
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/setup"));if(!x.ok||x.version!=="1.0.0-dev.6"||!String(x.telegram?.url||"").includes("sand-one-dev6-staging"))process.exit(1)'
          curl -sS "https://api.telegram.org/bot${BOT}/getMe" > /tmp/me
          USERNAME=$(node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/me"));if(!x.ok||!x.result?.username)process.exit(1);process.stdout.write(x.result.username)')
          curl -sS "$URL/health" > /tmp/health
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/health"));if(!x.ok||x.version!=="1.0.0-dev.6")process.exit(1)'
          printf 'READY\nversion=1.0.0-dev.6\nbot=@%s\nworker=%s\n' "$USERNAME" "$URL" > tools/sand-one-ci/dev6-manual-staging-ready.txt
          git config user.name 'SAND ONE CI'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/sand-one-ci/dev6-manual-staging-ready.txt
          git commit -m 'SAND ONE dev6: mark manual staging ready'
          git push origin HEAD:sand-one-1.0
