name: V10.7 Semantic Universal Live Certification

on:
  push:
    branches: [superagent-v10-7-universal-agent]
    paths:
      - '.github/workflows/v10-7-semantic-live-cert.yml'
      - 'tools/build-v10-7.py'
      - 'tools/finalize-v10-7.py'
      - 'tests/v10-7-static.mjs'
      - 'tests/v10-7-fast-semantic-live.mjs'
      - 'wrangler.v10-7-staging.template.jsonc'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v10-7-semantic-universal-live
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      STAGING_OMNIAI_API_KEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
      STAGING_URL: https://superagent-v107-staging.ahmeddoba91.workers.dev
      STAGING_DB: superagent-v106-staging
      STAGING_CONFIG: wrangler.v107.staging.jsonc

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$STAGING_TELEGRAM_BOT_TOKEN"
          test -n "$STAGING_OMNIAI_API_KEY"
          test -n "$STAGING_ADMIN_CHAT_ID"

      - name: Build and statically certify V10.7
        run: |
          set -euo pipefail
          python tools/build-v10-7.py
          python tools/finalize-v10-7.py
          node --check SuperAgent_V10_7_Universal_Agent.js
          node tests/v10-7-static.mjs SuperAgent_V10_7_Universal_Agent.js
          node tests/v10-2-semantic-ci.mjs SuperAgent_V10_7_Universal_Agent.js
          node tests/stress-v9-2.cjs SuperAgent_V10_7_Universal_Agent.js

      - name: Prepare staging config
        run: |
          node - <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('wrangler.v107.staging.jsonc',fs.readFileSync('wrangler.v10-7-staging.template.jsonc','utf8').replace('__D1_DATABASE_ID__','65df37bc-973d-4bfe-a3f4-7c049e570697'));
          NODE

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Deploy isolated V10.7 staging Worker
        run: npx wrangler deploy --config wrangler.v107.staging.jsonc

      - name: Rotate isolated staging secrets
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(openssl rand -hex 32)"
          SETUP_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$WEBHOOK_SECRET"; echo "::add-mask::$SETUP_KEY"
          echo "STAGING_TELEGRAM_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
          echo "STAGING_SETUP_KEY=$SETUP_KEY" >> "$GITHUB_ENV"
          printf '%s' "$STAGING_TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.v107.staging.jsonc
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.v107.staging.jsonc
          printf '%s' "$SETUP_KEY" | npx wrangler secret put SETUP_KEY --config wrangler.v107.staging.jsonc
          printf '%s' "$STAGING_OMNIAI_API_KEY" | npx wrangler secret put OMNIAI_API_KEY --config wrangler.v107.staging.jsonc
          printf '%s' "$STAGING_ADMIN_CHAT_ID" | npx wrangler secret put ADMIN_CHAT_ID --config wrangler.v107.staging.jsonc
          sleep 6

      - name: Initialize Telegram webhook
        run: |
          set -euo pipefail
          KEY="$(node -p 'encodeURIComponent(process.env.STAGING_SETUP_KEY)')"
          for i in $(seq 1 20); do
            CODE="$(curl -sS -o /tmp/setup.json -w '%{http_code}' "$STAGING_URL/setup?key=$KEY&force=1" || true)"
            if [ "$CODE" = 200 ] && node -e 'const x=require("/tmp/setup.json");if(!x.ok||x.message?.includes("10.6"))process.exit(1)' 2>/dev/null; then cat /tmp/setup.json; exit 0; fi
            sleep 2
          done
          cat /tmp/setup.json || true; exit 1

      - name: Reset live staging queues
        run: npx wrangler d1 execute superagent-v106-staging --remote --config wrangler.v107.staging.jsonc --command "DELETE FROM runtime_failures WHERE chat_id='$STAGING_ADMIN_CHAT_ID' OR chat_id IS NULL; DELETE FROM telegram_inbox_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID'; DELETE FROM telegram_chat_leases_v106 WHERE chat_id='$STAGING_ADMIN_CHAT_ID'; DELETE FROM telegram_updates WHERE chat_id='$STAGING_ADMIN_CHAT_ID';"

      - name: Focused semantic live gate
        run: node tests/v10-7-fast-semantic-live.mjs

      - name: Final health
        run: |
          set -euo pipefail
          curl -fsS "$STAGING_URL/health" | tee /tmp/health.json
          node -e 'const x=require("/tmp/health.json");if(!x.ok||!x.db||!x.omniai_service||x.version!=="10.7")process.exit(1)'

      - name: Build certificate
        run: |
          set -euo pipefail
          SHA="$(sha256sum SuperAgent_V10_7_Universal_Agent.js | cut -d' ' -f1)"
          cat > V10_7_CERTIFICATE.txt <<EOF
          Super Agent V10.7 — Semantic Universal Agent
          Build/static/legacy smoke: PASS
          Focused real Telegram semantic live gate: PASS
          Semantic-first natural-language planning: ENABLED
          Shopping first-class action + transactional rollback: ENABLED
          Context quantity/delete/ambiguity checks: PASS
          Shopping-vs-timed-reminder distinction: PASS
          Cloudflare RegExp/string tuple IntelliSense fix: PASS
          SHA256: $SHA
          EOF

      - name: Upload V10.7 package
        uses: actions/upload-artifact@v4
        with:
          name: SuperAgent-V10.7-Universal-Agent
          retention-days: 30
          if-no-files-found: error
          path: |
            SuperAgent_V10_7_Universal_Agent.js
            V10_7_CERTIFICATE.txt
            wrangler.v10-7-staging.template.jsonc

      - name: Commit certified V10.7 candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SuperAgent_V10_7_Universal_Agent.js V10_7_CERTIFICATE.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Certify V10.7 semantic universal agent'
          git pull --rebase origin superagent-v10-7-universal-agent
          git push origin HEAD:superagent-v10-7-universal-agent
