name: V11.3 Live Failure Diagnose

on:
  push:
    branches: [superagent-v11-3-live-test]
    paths: ['.github/workflows/v11-3-live-diagnose.yml']
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Query live V11.3 staging failure evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "superagent-v113-staging",
            "main": "./SuperAgent_V11_2_FULL.js",
            "compatibility_date": "2026-08-16",
            "d1_databases": [{"binding":"DB","database_name":"superagent-v106-staging","database_id":"65df37bc-973d-4bfe-a3f4-7c049e570697"}]
          }
          EOF
          echo '=== MODEL STATS ==='
          npx wrangler d1 execute superagent-v106-staging --remote --config /tmp/wrangler.jsonc --command "SELECT model_id,attempts,successes,failures,last_latency_ms,last_error,updated_at FROM model_stats ORDER BY updated_at DESC;"
          echo '=== TELEGRAM UPDATES ==='
          npx wrangler d1 execute superagent-v106-staging --remote --config /tmp/wrangler.jsonc --command "SELECT update_id,status,error_text,started_at,finished_at FROM telegram_updates WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY CAST(update_id AS INTEGER) DESC LIMIT 12;"
          echo '=== RUNTIME FAILURES ==='
          npx wrangler d1 execute superagent-v106-staging --remote --config /tmp/wrangler.jsonc --command "SELECT incident_id,scope,error_text,created_at FROM runtime_failures ORDER BY id DESC LIMIT 15;"
          echo '=== REMINDERS ==='
          npx wrangler d1 execute superagent-v106-staging --remote --config /tmp/wrangler.jsonc --command "SELECT id,title,local_date,local_time,cancelled,sent FROM reminders WHERE chat_id='$STAGING_ADMIN_CHAT_ID' ORDER BY id DESC LIMIT 10;"
