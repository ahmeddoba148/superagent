name: Patch V1152 Certification Guard
on:
  push:
    branches:
      - superagent-v11-5-2-final
    paths:
      - .github/workflows/patch-v11-5-2-cert2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch release workflow
        run: python3 tools/patch_v1152_cert.py
      - name: Commit patch
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add -- .github/workflows/release-v11-5-2-final.yml
          git commit -m "Harden V11.5.2 certification propagation checks"
          git push origin HEAD:superagent-v11-5-2-final
