name: Build SuperAgent Next 2.3 upload

on:
  push:
    branches:
      - superagent-next-2-3-clean-slate
    paths:
      - '.sa2_upload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: superagent-next-2-3-upload
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: superagent-next-2-3-clean-slate
          fetch-depth: 0

      - name: Check all upload parts exist
        id: parts
        shell: bash
        run: |
          set -euo pipefail
          ok=1
          for i in 0 1 2 3 4; do
            if [ ! -f ".sa2_upload/part${i}.b64" ]; then ok=0; fi
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"

      - name: Reconstruct exact JS
        if: steps.parts.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          cat .sa2_upload/part0.b64 .sa2_upload/part1.b64 .sa2_upload/part2.b64 .sa2_upload/part3.b64 .sa2_upload/part4.b64 | base64 -d | gzip -d > SuperAgent_Next_2.3_FULL_PARITY_CLEAN_SLATE.js
          echo 'f0de2758af2fd6147a1ee76ceeb5f9c72afb5eada168c4beb48adcb9a47fa409  SuperAgent_Next_2.3_FULL_PARITY_CLEAN_SLATE.js' | sha256sum -c -
          node --check SuperAgent_Next_2.3_FULL_PARITY_CLEAN_SLATE.js

      - name: Commit reconstructed file
        if: steps.parts.outputs.ready == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SuperAgent_Next_2.3_FULL_PARITY_CLEAN_SLATE.js
          if git diff --cached --quiet; then
            echo 'Exact file already committed.'
            exit 0
          fi
          git commit -m 'Add SuperAgent Next 2.3 full clean-slate worker'
          git push origin HEAD:superagent-next-2-3-clean-slate
