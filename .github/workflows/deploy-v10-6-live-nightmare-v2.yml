name: Deploy and Live-Test V10.6 Nightmare V2

on:
  push:
    branches: [superagent-v10-6-zero-known-failures]
    paths: ['.github/workflows/deploy-v10-6-live-nightmare-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v10-6-live-staging-v2
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
      STAGING_OMNIAI_API_KEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
      STAGING_ADMIN_CHAT_ID: ${{ secrets.STAGING_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate masked ephemeral secrets
        run: |
          WEBHOOK_SECRET="$(openssl rand -hex 32)"; SETUP_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$WEBHOOK_SECRET"; echo "::add-mask::$SETUP_KEY"
          echo "STAGING_TELEGRAM_WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
          echo "STAGING_SETUP_KEY=$SETUP_KEY" >> "$GITHUB_ENV"
      - run: npm install --no-save wrangler@latest
      - name: Build config
        run: node -e 'const fs=require("fs");let s=fs.readFileSync("wrangler.v10-6-staging.template.jsonc","utf8").replace("__D1_DATABASE_ID__","65df37bc-973d-4bfe-a3f4-7c049e570697");fs.writeFileSync("wrangler.v106.staging.jsonc",s)'
      - name: Deploy exact V10.6 source
        run: npx wrangler deploy --config wrangler.v106.staging.jsonc
      - name: Rotate staging secrets
        run: |
          printf '%s' "$STAGING_TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.v106.staging.jsonc
          printf '%s' "$STAGING_TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.v106.staging.jsonc
          printf '%s' "$STAGING_SETUP_KEY" | npx wrangler secret put SETUP_KEY --config wrangler.v106.staging.jsonc
          printf '%s' "$STAGING_OMNIAI_API_KEY" | npx wrangler secret put OMNIAI_API_KEY --config wrangler.v106.staging.jsonc
          printf '%s' "$STAGING_ADMIN_CHAT_ID" | npx wrangler secret put ADMIN_CHAT_ID --config wrangler.v106.staging.jsonc
      - name: Wait for secret propagation
        run: sleep 8
      - name: Initialize with retries
        run: |
          set -euo pipefail
          URL='https://superagent-v106-staging.ahmeddoba91.workers.dev'
          KEY="$(node -p 'encodeURIComponent(process.env.STAGING_SETUP_KEY)')"
          ok=0
          for i in $(seq 1 15); do
            CODE="$(curl -sS -o /tmp/setup.json -w '%{http_code}' "$URL/setup?key=$KEY&force=1" || true)"
            if [ "$CODE" = 200 ] && node -e 'const x=require("/tmp/setup.json");if(!x.ok)process.exit(1)' 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
      - name: Stable selftest 32/32
        run: |
          set -euo pipefail
          URL='https://superagent-v106-staging.ahmeddoba91.workers.dev'
          KEY="$(node -p 'encodeURIComponent(process.env.STAGING_SETUP_KEY)')"
          ok=0
          for i in $(seq 1 15); do
            CODE="$(curl -sS -o /tmp/selftest.json -w '%{http_code}' "$URL/selftest?key=$KEY" || true)"
            if [ "$CODE" = 200 ] && node -e 'const x=require("/tmp/selftest.json");if(!x.ok||x.version!=="10.6"||x.passed!==x.total||x.total<32)process.exit(1)' 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
          node -e 'const x=require("/tmp/selftest.json");console.log(`SELFTEST ${x.passed}/${x.total} PASS`)'
      - name: Clear historical staging failures
        run: npx wrangler d1 execute superagent-v106-staging --remote --config wrangler.v106.staging.jsonc --command "DELETE FROM runtime_failures WHERE chat_id='$STAGING_ADMIN_CHAT_ID';"
      - name: Real 40-way pressure and crash recovery
        env:
          STAGING_URL: https://superagent-v106-staging.ahmeddoba91.workers.dev
        run: node tests/v10-6-live-pressure.mjs
      - name: Full human live matrix
        env:
          STAGING_URL: https://superagent-v106-staging.ahmeddoba91.workers.dev
        run: |
          cp tests/v10-5-live-staging-matrix.mjs tests/v10-6-human-live-temp.mjs
          sed -i 's/superagent-v105-staging/superagent-v106-staging/g; s/wrangler.staging.jsonc/wrangler.v106.staging.jsonc/g; s/V10.5/V10.6/g' tests/v10-6-human-live-temp.mjs
          node tests/v10-6-human-live-temp.mjs
      - name: Stale receipt live regression
        env:
          STAGING_URL: https://superagent-v106-staging.ahmeddoba91.workers.dev
        run: |
          cp tests/v10-5-live-stale-receipt.mjs tests/v10-6-stale-temp.mjs
          sed -i 's/superagent-v105-staging/superagent-v106-staging/g; s/wrangler.staging.jsonc/wrangler.v106.staging.jsonc/g' tests/v10-6-stale-temp.mjs
          node tests/v10-6-stale-temp.mjs
      - name: Final live integrity
        run: |
          URL='https://superagent-v106-staging.ahmeddoba91.workers.dev'
          curl -fsS "$URL/health" | tee /tmp/health.json
          node -e 'const x=require("/tmp/health.json");if(!x.ok||!x.db||!x.omniai_service)process.exit(1)'
          npx wrangler d1 execute superagent-v106-staging --remote --json --config wrangler.v106.staging.jsonc --command "SELECT status,COUNT(*) c FROM telegram_inbox_v106 GROUP BY status; SELECT COUNT(*) c FROM telegram_inbox_v106 WHERE status IN ('pending','processing','failed'); SELECT COUNT(*) c FROM runtime_failures WHERE chat_id='$STAGING_ADMIN_CHAT_ID';"
