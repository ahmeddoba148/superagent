name: SAND ONE 10-Model Chain Promotion

on:
  push:
    branches: [sand-one-1.0]
    paths:
      - '.github/workflows/sand-one-model-chain-10-promotion.yml'

permissions:
  contents: write

concurrency:
  group: sand-one-model-chain-10-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Optimize failover order and budget
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old_chain = '''const AI_MODELS = Object.freeze([\n  Object.freeze({ id: "groq::openai/gpt-oss-120b", role: "primary" }),\n  Object.freeze({ id: "mistral::mistral-large-latest", role: "fallback_1" }),\n  Object.freeze({ id: "gemini::gemini-3.6-flash", role: "fallback_2" }),\n  Object.freeze({ id: "groq::qwen/qwen3.6-27b", role: "fallback_3" }),\n  Object.freeze({ id: "mistral::mistral-medium-latest", role: "fallback_4" }),\n  Object.freeze({ id: "nvidia::nvidia/nemotron-3-super-120b-a12b", role: "fallback_5" }),\n  Object.freeze({ id: "nvidia::nvidia/nemotron-3-ultra-550b-a55b", role: "fallback_6" }),\n  Object.freeze({ id: "nvidia::nvidia/nemotron-3-nano-30b-a3b", role: "fallback_7" }),\n  Object.freeze({ id: "openrouter::nvidia/nemotron-3-super-120b-a12b:free", role: "fallback_8" }),\n  Object.freeze({ id: "openrouter::google/gemma-4-31b-it:free", role: "fallback_9" }),\n]);'''

          new_chain = '''const AI_MODELS = Object.freeze([\n  Object.freeze({ id: "groq::openai/gpt-oss-120b", role: "primary" }),\n  Object.freeze({ id: "nvidia::nvidia/nemotron-3-super-120b-a12b", role: "fallback_1" }),\n  Object.freeze({ id: "mistral::mistral-medium-latest", role: "fallback_2" }),\n  Object.freeze({ id: "nvidia::nvidia/nemotron-3-nano-30b-a3b", role: "fallback_3" }),\n  Object.freeze({ id: "mistral::mistral-large-latest", role: "fallback_4" }),\n  Object.freeze({ id: "openrouter::nvidia/nemotron-3-super-120b-a12b:free", role: "fallback_5" }),\n  Object.freeze({ id: "gemini::gemini-3.6-flash", role: "fallback_6" }),\n  Object.freeze({ id: "groq::qwen/qwen3.6-27b", role: "fallback_7" }),\n  Object.freeze({ id: "nvidia::nvidia/nemotron-3-ultra-550b-a55b", role: "fallback_8" }),\n  Object.freeze({ id: "openrouter::google/gemma-4-31b-it:free", role: "fallback_9" }),\n]);'''

          old_budget = 'const AI_TOTAL_BUDGET_MS = 12_000;'
          new_budget = 'const AI_TOTAL_BUDGET_MS = 18_000;'

          for name in ['sand_one/runtime/part00.js.txt', 'sand_v2/source_parts/part00.js.txt']:
              p = Path(name)
              s = p.read_text()
              if s.count(old_chain) != 1:
                  raise SystemExit(f'{name}: expected current model chain exactly once, got {s.count(old_chain)}')
              if s.count(old_budget) != 1:
                  raise SystemExit(f'{name}: expected 12s AI budget exactly once, got {s.count(old_budget)}')
              s = s.replace(old_chain, new_chain).replace(old_budget, new_budget)
              p.write_text(s)
          PY

      - name: Static and type verification
        run: |
          set -euo pipefail
          for f in sand_one/runtime/part00.js.txt sand_v2/source_parts/part00.js.txt; do
            grep -Fq 'const AI_TOTAL_BUDGET_MS = 18_000;' "$f"
            grep -Fq 'nvidia::nvidia/nemotron-3-super-120b-a12b", role: "fallback_1"' "$f"
            grep -Fq 'nvidia::nvidia/nemotron-3-nano-30b-a3b", role: "fallback_3"' "$f"
          done
          node sand_v2/assemble.mjs
          node --check SAND_CORE_V2.js
          cat sand_one/runtime/part*.js.txt > SAND_ONE_CHAIN_TEST.js
          node --check SAND_ONE_CHAIN_TEST.js
          npm install --no-save typescript@5.8.3 >/dev/null
          printf '%s' '{"compilerOptions":{"allowJs":true,"checkJs":true,"noEmit":true,"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM"],"skipLibCheck":true,"strict":false},"files":["SAND_CORE_V2.js","SAND_ONE_CHAIN_TEST.js"]}' > tsconfig.model-chain.json
          npx tsc -p tsconfig.model-chain.json --pretty false

      - name: Commit verified runtime failover fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sand_one/runtime/part00.js.txt sand_v2/source_parts/part00.js.txt
          git diff --cached --check
          git commit -m 'SAND Core: make 10-model failover reachable'
          git push origin HEAD:sand-one-1.0
