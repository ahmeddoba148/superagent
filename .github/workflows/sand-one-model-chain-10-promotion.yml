name: SAND ONE dev6 Certified Root Materialization

on:
  push:
    branches: [sand-one-1.0]
    paths:
      - '.github/workflows/sand-one-model-chain-10-promotion.yml'

permissions:
  contents: write

concurrency:
  group: sand-one-dev6-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize exact certified dev6 root
        run: |
          set -euo pipefail
          EXPECTED_SHA='17204a5592cc4b6e0700dd4d39d6bcfeafb9c11bfef399cdac36637a45604ea6'
          EXPECTED_LINES='4609'
          EXPECTED_BYTES='250890'

          test -s sand_one/runtime/manifest.json
          test "$(node -p 'require("./sand_one/runtime/manifest.json").version')" = '1.0.0-dev.6'
          test "$(node -p 'require("./sand_one/runtime/manifest.json").parts')" = '30'
          count=$(find sand_one/runtime -maxdepth 1 -type f -name 'part*.js.txt' | wc -l | tr -d ' ')
          test "$count" = '30'

          cat sand_one/runtime/part*.js.txt > /tmp/SAND_ONE_1.0.certified.js
          actual_sha=$(sha256sum /tmp/SAND_ONE_1.0.certified.js | cut -d' ' -f1)
          actual_lines=$(wc -l < /tmp/SAND_ONE_1.0.certified.js | tr -d ' ')
          actual_bytes=$(wc -c < /tmp/SAND_ONE_1.0.certified.js | tr -d ' ')

          echo "CERTIFIED_SHA=$actual_sha"
          echo "CERTIFIED_LINES=$actual_lines"
          echo "CERTIFIED_BYTES=$actual_bytes"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$actual_lines" = "$EXPECTED_LINES"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          node --check /tmp/SAND_ONE_1.0.certified.js

          cp /tmp/SAND_ONE_1.0.certified.js SAND_ONE_1.0.js
          test "$(sha256sum SAND_ONE_1.0.js | cut -d' ' -f1)" = "$EXPECTED_SHA"
          cmp -s SAND_ONE_1.0.js /tmp/SAND_ONE_1.0.certified.js

      - name: Remove dev6-only temporary scaffolding
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/sand-one-model-chain-10-promotion.yml \
            .github/workflows/sand-one-rate-limit-retry-fix.yml \
            .github/workflows/sand-model-candidate-probe.yml \
            .github/workflows/sand-model-chain-cleanup.yml \
            tools/sand-one-rate-limit-retry-trigger.txt \
            tools/sand-one-model-chain-10-trigger.txt \
            tools/sand-one-ci/dev6-local-life-certification.txt \
            tools/sand-one-ci/dev6-manual-staging-ready.txt \
            tools/sand-one-ci/dev6-memory-failover-certification.txt \
            tools/sand-one-ci/dev6-single-gate-trigger.txt \
            tools/sand-one-ci/model-candidate-probe-trigger.txt \
            tools/sand-one-ci/model-chain-10-recertification.txt \
            tools/sand-one-ci/model-chain-cleanup-trigger.txt \
            tools/sand-one-ci/run-core-torture.mjs

      - name: Commit exact certified root and cleanup
        run: |
          set -euo pipefail
          EXPECTED_SHA='17204a5592cc4b6e0700dd4d39d6bcfeafb9c11bfef399cdac36637a45604ea6'
          test "$(sha256sum SAND_ONE_1.0.js | cut -d' ' -f1)" = "$EXPECTED_SHA"
          node --check SAND_ONE_1.0.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SAND_ONE_1.0.js
          git diff --cached --check
          git status --short
          git commit -m 'SAND ONE dev6: materialize certified root and clean test scaffolding'
          git push origin HEAD:sand-one-1.0
