name: SAND Model Chain Cleanup
on:
  push:
    branches: [sand-one-1.0]
    paths:
      - '.github/workflows/sand-model-chain-cleanup.yml'
      - 'tools/sand-one-ci/model-chain-cleanup-trigger.txt'
permissions:
  contents: write
concurrency:
  group: sand-model-chain-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OKEY: ${{ secrets.STAGING_OMNIAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sand-one-1.0
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Select five live high-quality fallbacks
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const key = String(process.env.OKEY || '');
          if (!key) throw new Error('missing OKEY');
          const endpoint = 'https://omniai-engine.ahmeddoba91.workers.dev/v1/chat/completions';
          const candidates = [
            'nvidia::nvidia/nemotron-3-super-120b-a12b',
            'nvidia::mistralai/mistral-small-4-119b-2603',
            'nvidia::nvidia/nemotron-3-nano-30b-a3b',
            'openrouter::nvidia/nemotron-3-super-120b-a12b:free',
            'openrouter::google/gemma-4-31b-it:free',
            'nvidia::deepseek-ai/deepseek-v4-flash',
            'gemini::gemini-3.5-flash',
            'mistral::mistral-small-latest',
            'openrouter::openai/gpt-oss-20b:free',
            'nvidia::openai/gpt-oss-120b',
          ];
          const selected = [];
          for (const model of candidates) {
            const started = Date.now();
            try {
              const r = await fetch(endpoint, {
                method: 'POST',
                headers: { authorization: `Bearer ${key}`, 'content-type': 'application/json' },
                body: JSON.stringify({ model, messages: [{role:'user',content:'رد بكلمة OK فقط'}], max_tokens: 16, stream: false }),
                signal: AbortSignal.timeout(12000),
              });
              const ms = Date.now() - started;
              if (r.ok) {
                selected.push(model);
                console.log(`SELECT_CANDIDATE_LIVE model=${model} latency_ms=${ms}`);
              } else {
                const body=(await r.text().catch(()=>'' )).replace(/\s+/g,' ').slice(0,180);
                console.log(`SELECT_CANDIDATE_FAIL model=${model} status=${r.status} latency_ms=${ms} body=${body}`);
              }
            } catch (e) {
              console.log(`SELECT_CANDIDATE_FAIL model=${model} status=network latency_ms=${Date.now()-started} body=${String(e?.message||e).slice(0,160)}`);
            }
            if (selected.length >= 5) break;
          }
          if (selected.length < 5) throw new Error(`NEED_5_LIVE_FALLBACKS got=${selected.length}`);
          fs.writeFileSync('/tmp/selected-models.json', JSON.stringify(selected, null, 2));
          console.log('SELECTED_FALLBACKS='+JSON.stringify(selected));
          NODE
      - name: Patch exact ten-model chain
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          selected=json.loads(Path('/tmp/selected-models.json').read_text())
          fixed=[
            'groq::openai/gpt-oss-120b',
            'mistral::mistral-large-latest',
            'groq::qwen/qwen3.6-27b',
            'gemini::gemini-3.6-flash',
            'mistral::mistral-medium-latest',
          ]
          models=fixed+selected
          if len(models)!=10 or len(set(models))!=10: raise SystemExit(f'bad final model chain: {models}')
          block='const AI_MODELS = Object.freeze([\n'+''.join(
            f'  Object.freeze({{ id: "{m}", role: "'+('primary' if i==0 else f'fallback_{i}')+'" }),\n'
            for i,m in enumerate(models)
          )+']);'
          pat=re.compile(r'const AI_MODELS = Object\.freeze\(\[[\s\S]*?\]\);')
          for name in ['sand_one/runtime/part00.js.txt','sand_v2/source_parts/part00.js.txt']:
            p=Path(name); s=p.read_text()
            ns,n=pat.subn(block,s,count=1)
            if n!=1: raise SystemExit(f'{name}: AI_MODELS block mismatch')
            p.write_text(ns)
          PY
      - name: Harden canonical model probe
        run: |
          set -euo pipefail
          cat > tools/sand-one-ci/probe-models.mjs <<'NODE'
          import fs from 'node:fs';
          const key=String(process.env.OKEY||'');
          if(!key) throw new Error('missing OKEY');
          const endpoint='https://omniai-engine.ahmeddoba91.workers.dev/v1/chat/completions';
          const source=fs.readFileSync('sand_one/runtime/part00.js.txt','utf8');
          const block=source.match(/const AI_MODELS = Object\.freeze\(\[([\s\S]*?)\]\);/);
          const models=[...String(block?.[1]??'').matchAll(/id:\s*"([^"]+)"/g)].map(m=>m[1]);
          if(models.length!==10) throw new Error(`MODEL_CHAIN_EXPECTED_10 got=${models.length}`);
          let live=0; const providers=new Set(); const transient=[]; const permanent=[];
          for(const model of models){
            const started=Date.now();
            try{
              const r=await fetch(endpoint,{method:'POST',headers:{authorization:`Bearer ${key}`,'content-type':'application/json'},body:JSON.stringify({model,messages:[{role:'user',content:'رد OK فقط'}],max_tokens:16,stream:false}),signal:AbortSignal.timeout(10000)});
              const ms=Date.now()-started;
              if(r.ok){live++;providers.add(model.split('::',1)[0]);console.log(`${model} LIVE ${r.status} ${ms}ms`);continue;}
              const body=(await r.text().catch(()=>'' )).replace(/\s+/g,' ').slice(0,180);
              const item=`${model}:HTTP_${r.status}`;
              if([400,401,402,403,404,405,409,410,422].includes(r.status)){permanent.push(item);console.log(`${model} PERMANENT ${r.status} ${ms}ms ${body}`);}
              else {transient.push(item);console.log(`${model} TRANSIENT ${r.status} ${ms}ms ${body}`);}
            }catch(e){transient.push(`${model}:${String(e?.message||e)}`);console.log(`${model} TRANSIENT ${String(e?.message||e)}`);}
          }
          if(permanent.length) throw new Error(`MODEL_CHAIN_PERMANENT_FAILURE: ${permanent.join(' | ')}`);
          if(live<5 || providers.size<3) throw new Error(`MODEL_CHAIN_DIVERSITY_FAILED live=${live} providers=${providers.size} transient=${transient.join(' | ')}`);
          console.log(`SAND_MODEL_CHAIN_FAILOVER_PROBE_OK configured=10 live=${live} providers=${providers.size} transient=${transient.length} permanent=0`);
          NODE
      - name: Static verification
        run: |
          set -euo pipefail
          node sand_v2/assemble.mjs
          node --check SAND_CORE_V2.js
          cat sand_one/runtime/part*.js.txt > /tmp/SAND_ONE_1.0.js
          node --check /tmp/SAND_ONE_1.0.js
          npm install --no-save typescript@5.8.3 >/dev/null
          printf '%s' '{"compilerOptions":{"allowJs":true,"checkJs":true,"noEmit":true,"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM"],"skipLibCheck":true,"strict":false},"files":["SAND_CORE_V2.js"]}' > tsconfig.json
          npx tsc -p tsconfig.json --pretty false
          printf '%s' '{"compilerOptions":{"allowJs":true,"checkJs":true,"noEmit":true,"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","lib":["ES2022","DOM"],"skipLibCheck":true,"strict":false},"files":["/tmp/SAND_ONE_1.0.js"]}' > /tmp/tsconfig-sand.json
          npx tsc -p /tmp/tsconfig-sand.json --pretty false
      - name: Commit selected live chain
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sand_one/runtime/part00.js.txt sand_v2/source_parts/part00.js.txt tools/sand-one-ci/probe-models.mjs
          git diff --cached --check
          git commit -m 'SAND Core: replace dead fallbacks with live diversified models'
          git pull --rebase --autostash origin sand-one-1.0
          git push origin HEAD:sand-one-1.0
